<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff0099">

<title>Madhu Music World 🎵</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
background:#07070d;
color:#fff;
font-family:Arial,"Noto Sans Bengali",sans-serif;
padding-bottom:92px;
}

button,input{font:inherit}
button{cursor:pointer}

.top{
position:sticky;
top:0;
z-index:50;
background:rgba(7,7,13,.95);
backdrop-filter:blur(14px);
border-bottom:1px solid #272337;
padding:15px 18px;
}

.topbar{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.logo{
font-size:28px;
font-weight:800;
letter-spacing:-1px;
}

.logo span{color:#ff0a9d}

.search{
width:46px;
height:46px;
border:0;
border-radius:50%;
background:#171523;
color:#fff;
font-size:22px;
}

.wrap{
max-width:900px;
margin:auto;
padding:18px;
}

.hero{
min-height:285px;
border-radius:30px;
overflow:hidden;

background:
radial-gradient(circle at 72% 30%,#ff00a8 0,#8d006e 18%,transparent 38%),
linear-gradient(135deg,#170033,#36005d 45%,#0c0a19);

position:relative;
display:flex;
align-items:flex-end;
padding:28px;
margin-bottom:20px;

box-shadow:0 18px 55px #0008;
}

.hero:after{
content:"🎧";
position:absolute;
right:24px;
top:25px;
font-size:110px;
opacity:.28;
filter:drop-shadow(0 0 25px #ff00b7);
}

.hero h1{
font-size:42px;
margin:0 0 8px;
position:relative;
z-index:2;
}

.hero p{
font-size:18px;
color:#d8d2df;
margin:0;
position:relative;
z-index:2;
}

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-bottom:26px;
}

.cat{
border:1px solid #302b3e;
background:#12111c;
color:#fff;
border-radius:22px;
padding:19px 15px;
font-size:19px;
transition:.2s;
}

.cat.active,
.cat:hover{
background:linear-gradient(135deg,#ff009d,#a900ff);
border-color:#ff31ba;
box-shadow:0 8px 30px #ff009933;
}

.cat.all{
grid-column:1/-1;
}

.title-row{
display:flex;
justify-content:space-between;
align-items:center;
margin:12px 0;
}

.title-row h2{
font-size:27px;
margin:0;
}

.status{
color:#ff0aa0;
font-weight:700;
}

.station-list{
display:grid;
gap:13px;
}

.station{
background:#12111c;
border:1px solid #292638;
border-radius:23px;
padding:13px;
display:flex;
align-items:center;
gap:13px;
}

.station img,
.station-icon{
width:68px;
height:68px;
border-radius:18px;
object-fit:cover;
flex:none;
}

.station-icon{
display:grid;
place-items:center;
font-size:32px;
background:linear-gradient(135deg,#28005b,#85006c);
}

.info{
min-width:0;
flex:1;
}

.name{
font-size:18px;
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.meta{
font-size:14px;
color:#9e99aa;
margin-top:5px;
}

.play{
width:52px;
height:52px;
border:0;
border-radius:50%;
background:#ff009d;
color:#fff;
font-size:22px;
flex:none;
box-shadow:0 6px 22px #ff009944;
}

.play.playing{
background:#7a00ff;
}

.empty{
text-align:center;
padding:30px 15px;
color:#a6a1ad;
background:#10101a;
border:1px dashed #363044;
border-radius:22px;
}

.player{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:100;
background:rgba(15,14,23,.97);
border-top:1px solid #302b3d;
padding:10px 15px;
}

.player-inner{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
gap:12px;
}

.now-icon{
width:48px;
height:48px;
border-radius:15px;
background:#31005f;
display:grid;
place-items:center;
font-size:24px;
}

.now{
min-width:0;
flex:1;
}

.now b,
.now small{
display:block;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.now small{
color:#aaa3b3;
margin-top:3px;
}

.mainplay{
width:52px;
height:52px;
border:0;
border-radius:50%;
background:#ff009d;
color:#fff;
font-size:22px;
}

audio{
display:none;
}

.msg{
font-size:13px;
color:#ff8bce;
margin:5px 0 0;
}

@media(max-width:520px){

.logo{
font-size:24px;
}

.hero{
min-height:255px;
padding:23px;
}

.hero h1{
font-size:34px;
}

.hero:after{
font-size:85px;
right:10px;
}

.station img,
.station-icon{
width:58px;
height:58px;
}

.name{
font-size:16px;
}

.play{
width:48px;
height:48px;
}

}
</style>
</head>

<body>

<header class="top">

<div class="topbar">

<div class="logo">
Madhu Music World <span>🎵</span>
</div>

<button class="search"
onclick="focusSearch()"
aria-label="Search">
🔎
</button>

</div>

</header>


<main class="wrap">


<section class="hero">

<div>

<h1>Feel The Music</h1>

<p>
Live Online Radio • Your Music World
</p>

<div class="msg" id="message"></div>

</div>

</section>


<div class="categories">

<button class="cat all active"
data-cat="all">
🎵 All Stations
</button>

<button class="cat"
data-cat="bengali">
🎶 Bengali
</button>

<button class="cat"
data-cat="hindi">
🎵 Hindi
</button>

<button class="cat"
data-cat="rabindra">
🎼 Rabindra Sangeet
</button>

<button class="cat"
data-cat="bhajan">
🕉️ Bhajan
</button>

<button class="cat"
data-cat="old">
🕰️ পুরোনো বাংলা গান
</button>

</div>


<div class="title-row">

<h2 id="sectionTitle">
Popular Online Stations
</h2>

<span class="status" id="count">
লোড হচ্ছে…
</span>

</div>


<input
id="searchBox"
type="search"
placeholder="স্টেশনের নাম লিখে খুঁজুন…"
style="
width:100%;
padding:15px 17px;
border-radius:18px;
border:1px solid #302b3e;
background:#11101a;
color:#fff;
outline:none;
margin-bottom:14px;
">


<section
id="stations"
class="station-list">
</section>


</main>


<div class="player">

<div class="player-inner">

<div class="now-icon">
🎧
</div>

<div class="now">

<b id="nowName">
কোনো স্টেশন চালু নেই
</b>

<small id="nowMeta">
একটি station থেকে Play চাপুন
</small>

</div>

<button
class="mainplay"
id="mainPlay"
onclick="toggleMain()">
▶
</button>

</div>

</div>


<audio
id="audio"
preload="none">
</audio>


<script>

const API_HOSTS=[

"https://de1.api.radio-browser.info",

"https://de2.api.radio-browser.info",

"https://fr1.api.radio-browser.info"

];


const audio=document.getElementById("audio");

const list=document.getElementById("stations");

const count=document.getElementById("count");

const title=document.getElementById("sectionTitle");

const searchBox=document.getElementById("searchBox");

const message=document.getElementById("message");

const nowName=document.getElementById("nowName");

const nowMeta=document.getElementById("nowMeta");

const mainPlay=document.getElementById("mainPlay");


let currentCategory="all";

let currentStation=null;

let currentStations=[];

let cache={};


const configs={


all:{

title:"Popular Online Stations",

queries:[

"countrycode=IN&hidebroken=true&is_https=true&order=votes&reverse=true&limit=30",

"language=bengali&hidebroken=true&is_https=true&order=votes&reverse=true&limit=20"

]

},


bengali:{

title:"Bengali Music",

queries:[

"language=bengali&countrycode=IN&hidebroken=true&is_https=true&order=votes&reverse=true&limit=40",

"language=bengali&countrycode=BD&hidebroken=true&is_https=true&order=votes&reverse=true&limit=20"

]

},


hindi:{

title:"Hindi Music",

queries:[

"language=hindi&countrycode=IN&hidebroken=true&is_https=true&order=votes&reverse=true&limit=40"

]

},


rabindra:{

title:"Rabindra Sangeet",

queries:[

"name=Rabindra&hidebroken=true&is_https=true&order=votes&reverse=true&limit=20",

"name=Tagore&hidebroken=true&is_https=true&order=votes&reverse=true&limit=20",

"tag=rabindra&hidebroken=true&is_https=true&order=votes&reverse=true&limit=20"

]

},


bhajan:{

title:"Bhajan",

queries:[

"tag=bhajan&hidebroken=true&is_https=true&order=votes&reverse=true&limit=30",

"name=Bhakti&hidebroken=true&is_https=true&order=votes&reverse=true&limit=20"

]

},


old:{

title:"পুরোনো বাংলা গান",

queries:[

"name=Go%20Yesteryears&hidebroken=true&is_https=true&limit=10",

"name=Robichhaya&hidebroken=true&is_https=true&limit=10",

"name=Chirantanee&hidebroken=true&is_https=true&limit=10",

"tag=old%20songs&language=bengali&hidebroken=true&is_https=true&order=votes&reverse=true&limit=20",

"tag=oldies&language=bengali&hidebroken=true&is_https=true&order=votes&reverse=true&limit=20"

]

}

};


async function apiFetch(query){

let lastError=null;

for(const host of API_HOSTS){

try{

const r=await fetch(
host+"/json/stations/search?"+query,
{
headers:{
"Accept":"application/json"
}
}
);

if(!r.ok)
throw new Error("HTTP "+r.status);

const data=await r.json();

if(Array.isArray(data))
return data;

}
catch(e){

lastError=e;

}

}

throw lastError || new Error("API unavailable");

}


function unique(stations){

const m=new Map();

for(const s of stations){

const key=
s.stationuuid ||
s.url_resolved ||
s.url;

if(key && !m.has(key))
m.set(key,s);

}

return [...m.values()];

}


function cleanStations(arr){

return unique(arr)

.filter(s=>
(s.url_resolved || s.url)
)

.filter(s=>{

const u=s.url_resolved || s.url;

return /^https:/i.test(u);

})

.slice(0,60);

}


async function loadCategory(cat){

currentCategory=cat;

const cfg=configs[cat];

title.textContent=cfg.title;

count.textContent="লোড হচ্ছে…";

list.innerHTML=
'<div class="empty">📻 অনলাইন station খোঁজা হচ্ছে…</div>';

message.textContent="";


if(cache[cat]){

currentStations=cache[cat];

render();

return;

}


try{

const results=
await Promise.allSettled(
cfg.queries.map(apiFetch)
);

let all=[];

results.forEach(x=>{

if(x.status==="fulfilled")
all.push(...x.value);

});


currentStations=
cleanStations(all);


if(cat==="old"){

const relevant=
currentStations.filter(s=>{

const t=
((s.name||"")+" "+
(s.tags||"")+" "+
(s.language||""))
.toLowerCase();

return /beng|yester|robi|chirant|old|retro|classic|folk/.test(t);

});

if(relevant.length)
currentStations=relevant;

}


cache[cat]=currentStations;

render();


if(!currentStations.length){

message.textContent=
"এই মুহূর্তে সরাসরি HTTPS stream পাওয়া যায়নি। অন্য category চেষ্টা করুন।";

}

}
catch(e){

currentStations=[];

render();

message.textContent=
"Radio service এখন পাওয়া যাচ্ছে না। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

}

}


function render(){

const q=
searchBox.value.trim().toLowerCase();


const filtered=
currentStations.filter(s=>

!q ||

(
(s.name||"")+" "+
(s.tags||"")+" "+
(s.country||"")
)
.toLowerCase()
.includes(q)

);


count.textContent=
filtered.length+"টি";


if(!filtered.length){

list.innerHTML=
'<div class="empty">😔 কোনো online station পাওয়া যায়নি।<br>অন্য নাম/category চেষ্টা করুন।';

return;

}


list.innerHTML=
filtered.map((s,i)=>{

const icon=s.favicon

? `<img
src="${escapeAttr(s.favicon)}"
onerror="this.outerHTML='<div class=&quot;station-icon&quot;>🎵</div>'"
alt="">`

: `<div class="station-icon">🎵</div>`;


const playing=
currentStation &&
currentStation.stationuuid===s.stationuuid;


return `

<article class="station">

${icon}

<div class="info">

<div class="name">
${escapeHtml(s.name||"Online Radio")}
</div>

<div class="meta">

${escapeHtml(s.language||"Online")}

${s.country
? " • "+escapeHtml(s.country)
: ""}

</div>

</div>


<button
class="play ${playing?"playing":""}"
onclick="playStation(${i})">

${playing && !audio.paused
? "❚❚"
: "▶"}

</button>


</article>

`;

}).join("");

}


function playStation(index){

const q=
searchBox.value.trim().toLowerCase();


const filtered=
currentStations.filter(s=>

!q ||

(
(s.name||"")+" "+
(s.tags||"")+" "+
(s.country||"")
)
.toLowerCase()
.includes(q)

);


const s=filtered[index];

if(!s)
return;


const url=
s.url_resolved || s.url;


currentStation=s;


nowName.textContent=
s.name || "Online Radio";


nowMeta.textContent=
(s.language||"Online")+
" • "+
(s.country||"");


audio.src=url;


audio.play()

.then(()=>{

mainPlay.textContent="❚❚";

render();

})

.catch(()=>{

message.textContent=
"এই stream টি browser থেকে চালানো গেল না। অন্য station চেষ্টা করুন।";

mainPlay.textContent="▶";

render();

});

}


function toggleMain(){

if(!currentStation)
return;


if(audio.paused){

audio.play()

.then(()=>{

mainPlay.textContent="❚❚";

render();

})

.catch(()=>{});

}

else{

audio.pause();

mainPlay.textContent="▶";

render();

}

}


audio.addEventListener(
"play",
()=>{

mainPlay.textContent="❚❚";

render();

}
);


audio.addEventListener(
"pause",
()=>{

mainPlay.textContent="▶";

render();

}
);


audio.addEventListener(
"error",
()=>{

mainPlay.textContent="▶";

message.textContent=
"Stream বন্ধ বা unavailable। অন্য station Play করুন।";

render();

}
);


document
.querySelectorAll(".cat")
.forEach(btn=>{

btn.addEventListener(
"click",
()=>{

document
.querySelectorAll(".cat")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

searchBox.value="";

loadCategory(btn.dataset.cat);

}
);

});


searchBox.addEventListener(
"input",
render
);


function focusSearch(){

searchBox.focus();

searchBox.scrollIntoView({
behavior:"smooth",
block:"center"
});

}


function escapeHtml(v){

return String(v)
.replace(
/[&<>"']/g,
c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c])
);

}


function escapeAttr(v){

return escapeHtml(v)
.replace(/`/g,"&#96;");

}


loadCategory("all");

</script>

</body>
</html>
