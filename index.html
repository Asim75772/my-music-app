<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#ff0099">

<title>Madhu Music World 🎵</title>

<meta name="description"
content="Madhu Music World - Bengali, Retro, Oldies and Evergreen Online Radio">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

    background:#07060c;
    color:#fff;

    min-height:100vh;
    padding-bottom:95px;
}

/* ================= HEADER ================= */

.header{

    position:sticky;
    top:0;
    z-index:1000;

    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    background:rgba(8,7,14,.96);

    border-bottom:1px solid #252333;

    backdrop-filter:blur(15px);
}

.logo{

    font-size:32px;
    font-weight:800;

    white-space:nowrap;
}

.logo span{
    color:#777;
}

.search-btn{

    width:58px;
    height:58px;

    border-radius:50%;

    border:1px solid #302d3c;

    background:#15131f;

    color:white;

    font-size:30px;

    cursor:pointer;

    transition:.25s;
}

.search-btn:hover{
    background:#ff0099;
    transform:scale(1.05);
}

/* ================= SEARCH ================= */

.search-box{

    display:none;

    padding:15px 25px;

    background:#0e0d15;

    border-bottom:1px solid #292634;
}

.search-box.show{
    display:block;
}

.search-box input{

    width:100%;

    padding:15px 18px;

    border-radius:15px;

    border:1px solid #393447;

    outline:none;

    background:#181621;

    color:white;

    font-size:17px;
}

/* ================= MAIN ================= */

main{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px;
}

/* ================= HERO ================= */

.hero{

    position:relative;

    min-height:360px;

    margin:12px 0 28px;

    padding:45px 38px;

    border-radius:32px;

    overflow:hidden;

    background:
    radial-gradient(
        circle at 75% 30%,
        rgba(255,0,180,.65),
        rgba(120,0,180,.28) 32%,
        transparent 60%
    ),
    linear-gradient(
        135deg,
        #17002e,
        #36005f 55%,
        #110019
    );

    border:1px solid #3d2450;

    display:flex;

    align-items:flex-end;

    box-shadow:
    0 20px 60px rgba(170,0,255,.18);
}

/* headphone decoration */

.hero::after{

    content:"🎧";

    position:absolute;

    right:35px;
    top:10px;

    font-size:210px;

    opacity:.18;

    filter:
    drop-shadow(0 0 30px #ff00b7);

    transform:rotate(-8deg);
}

.hero-content{

    position:relative;

    z-index:2;

    max-width:80%;
}

.hero h1{

    font-size:
    clamp(40px,7vw,68px);

    line-height:1;

    margin-bottom:18px;

    font-weight:900;
}

.hero p{

    font-size:
    clamp(18px,3vw,26px);

    color:#e7e3ea;

    line-height:1.4;
}

/* ================= CATEGORIES ================= */

.categories{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:18px;

    margin-bottom:30px;
}

.category{

    min-height:100px;

    border-radius:24px;

    border:1px solid #302d3d;

    background:
    linear-gradient(
        145deg,
        #14121e,
        #0f0d17
    );

    color:white;

    cursor:pointer;

    font-size:22px;

    font-weight:700;

    transition:.25s;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    padding:20px;
}

.category:hover{

    transform:translateY(-3px);

    border-color:#ff0099;

    box-shadow:
    0 10px 35px rgba(255,0,153,.18);
}

.category.active{

    background:
    linear-gradient(
        135deg,
        #ff0099,
        #c900ff
    );

    border-color:#ff0099;

    box-shadow:
    0 10px 35px rgba(255,0,153,.35);
}

/* ================= SECTION ================= */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:30px 0 18px;
}

.section-title h2{

    font-size:30px;
}

.online{

    color:#ff0099;

    font-size:17px;
}

/* ================= STATIONS ================= */

.stations{

    display:flex;

    flex-direction:column;

    gap:15px;
}

.station{

    min-height:105px;

    display:flex;

    align-items:center;

    gap:18px;

    padding:17px 20px;

    border-radius:25px;

    background:#14121e;

    border:1px solid #2d2a38;

    transition:.25s;
}

.station:hover{

    border-color:#ff0099;

    transform:translateY(-2px);
}

.station-logo{

    width:75px;
    height:75px;

    flex-shrink:0;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:36px;

    background:
    linear-gradient(
        135deg,
        #24004b,
        #65009c
    );

    overflow:hidden;
}

.station-logo img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.station-info{

    flex:1;

    min-width:0;
}

.station-name{

    font-size:22px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.station-meta{

    margin-top:7px;

    color:#96929f;

    font-size:16px;
}

.station-buttons{

    display:flex;

    align-items:center;

    gap:10px;
}

.play-btn{

    width:62px;
    height:62px;

    border-radius:50%;

    border:none;

    background:#ff0099;

    color:white;

    font-size:25px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s;
}

.play-btn:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 25px rgba(255,0,153,.6);
}

.favorite-btn{

    width:45px;
    height:45px;

    border:none;

    background:transparent;

    color:#aaa;

    font-size:27px;

    cursor:pointer;
}

.favorite-btn.active{

    color:#ff0099;
}

/* ================= EMPTY ================= */

.empty{

    text-align:center;

    padding:60px 20px;

    color:#898590;

    font-size:19px;
}

/* ================= LOADING ================= */

.loading{

    text-align:center;

    padding:45px 20px;

    color:#aaa;

    font-size:18px;
}

.spinner{

    display:inline-block;

    width:30px;
    height:30px;

    border:3px solid #333;

    border-top-color:#ff0099;

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin-bottom:12px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

/* ================= PLAYER ================= */

.player{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:92px;

    z-index:2000;

    background:
    rgba(15,13,23,.97);

    border-top:1px solid #302d3c;

    backdrop-filter:blur(18px);

    display:flex;

    align-items:center;

    gap:15px;

    padding:12px 25px;
}

.player-logo{

    width:60px;
    height:60px;

    border-radius:18px;

    background:#35006a;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    flex-shrink:0;
}

.player-info{

    flex:1;

    min-width:0;
}

.player-name{

    font-size:18px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.player-meta{

    color:#aaa;

    margin-top:5px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.player-controls{

    display:flex;

    align-items:center;

    gap:12px;
}

.control{

    width:50px;
    height:50px;

    border:none;

    background:transparent;

    color:white;

    font-size:24px;

    cursor:pointer;
}

.main-play{

    width:60px;
    height:60px;

    border-radius:50%;

    background:#ff0099;

    border:none;

    color:white;

    font-size:25px;

    cursor:pointer;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:86px;

    z-index:1500;

    background:#11101a;

    border-top:1px solid #292634;

    display:flex;

    justify-content:space-around;

    align-items:center;
}

.nav-item{

    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:5px;

    color:#898690;

    font-size:15px;

    cursor:pointer;
}

.nav-icon{

    font-size:27px;
}

.nav-item.active{

    color:#ff0099;
}

/* player sits above nav */

.player{

    bottom:86px;
}

/* ================= TOAST ================= */

.toast{

    position:fixed;

    left:50%;

    bottom:180px;

    transform:
    translateX(-50%)
    translateY(20px);

    background:#24212e;

    color:white;

    padding:13px 20px;

    border-radius:14px;

    opacity:0;

    pointer-events:none;

    transition:.3s;

    z-index:5000;

    border:1px solid #3b3748;

    text-align:center;
}

.toast.show{

    opacity:1;

    transform:
    translateX(-50%)
    translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{

        height:78px;

        padding:0 20px;
    }

    .logo{

        font-size:25px;
    }

    .search-btn{

        width:52px;
        height:52px;

        font-size:27px;
    }

    main{

        padding:18px;
    }

    .hero{

        min-height:335px;

        padding:32px 25px;

        border-radius:28px;
    }

    .hero::after{

        font-size:145px;

        right:-10px;

        top:15px;
    }

    .hero-content{

        max-width:100%;
    }

    .hero h1{

        font-size:43px;
    }

    .hero p{

        font-size:19px;

        max-width:320px;
    }

    .categories{

        grid-template-columns:1fr;

        gap:12px;
    }

    .category{

        min-height:80px;

        font-size:20px;
    }

    .station{

        padding:14px;

        border-radius:20px;

        gap:12px;
    }

    .station-logo{

        width:62px;
        height:62px;

        border-radius:17px;

        font-size:28px;
    }

    .station-name{

        font-size:18px;
    }

    .station-meta{

        font-size:14px;
    }

    .favorite-btn{

        display:none;
    }

    .play-btn{

        width:55px;
        height:55px;
    }

    .player{

        height:82px;

        padding:10px 15px;

        gap:10px;
    }

    .player-logo{

        width:52px;
        height:52px;
    }

    .player-name{

        font-size:16px;
    }

    .player-meta{

        font-size:13px;
    }

    .control{

        display:none;
    }

    .main-play{

        width:58px;
        height:58px;
    }

    .bottom-nav{

        height:78px;
    }

    .player{

        bottom:78px;
    }

    .nav-icon{

        font-size:25px;
    }
}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        Madhu Music World 🎵
    </div>

    <button
        class="search-btn"
        onclick="toggleSearch()">
        🔎
    </button>

</header>


<!-- ================= SEARCH ================= -->

<div
    id="searchBox"
    class="search-box">

    <input
        id="searchInput"
        type="search"
        placeholder="Search radio station..."
        oninput="searchStations(this.value)">

</div>


<!-- ================= MAIN ================= -->

<main>


<!-- ================= BANNER ================= -->

<section class="hero">

    <div class="hero-content">

        <h1>
            Feel The Music
        </h1>

        <p>
            Live Radio • Bengali • Retro • Evergreen
        </p>

    </div>

</section>


<!-- ================= CATEGORIES ================= -->

<div class="categories">

    <button
        class="category active"
        data-category="all"
        onclick="selectCategory('all',this)">
        🎵 All Stations
    </button>

    <button
        class="category"
        data-category="bengali"
        onclick="selectCategory('bengali',this)">
        🎶 Bengali
    </button>

    <button
        class="category"
        data-category="retro"
        onclick="selectCategory('retro',this)">
        🕰️ পুরোনো বাংলা
    </button>

    <button
        class="category"
        data-category="hindi"
        onclick="selectCategory('hindi',this)">
        🎼 Hindi Oldies
    </button>

    <button
        class="category"
        data-category="english"
        onclick="selectCategory('english',this)">
        🎸 English Retro
    </button>

    <button
        class="category"
        data-category="favorite"
        onclick="selectCategory('favorite',this)">
        ❤️ Favorite
    </button>

</div>


<!-- ================= TITLE ================= -->

<div class="section-title">

    <h2 id="sectionTitle">
        🎵 All Stations
    </h2>

    <span class="online">
        Online
    </span>

</div>


<!-- ================= STATIONS ================= -->

<div
    id="stations"
    class="stations">

    <div class="loading">

        <div class="spinner"></div>

        <br>

        Radio station খোঁজা হচ্ছে...

    </div>

</div>


</main>


<!-- ================= PLAYER ================= -->

<div
    id="player"
    class="player">

    <div
        id="playerLogo"
        class="player-logo">
        🎧
    </div>

    <div class="player-info">

        <div
            id="playerName"
            class="player-name">
            কোনো স্টেশন চলছে না
        </div>

        <div
            id="playerMeta"
            class="player-meta">
            একটি Radio Station নির্বাচন করুন
        </div>

    </div>

    <div class="player-controls">

        <button
            class="control"
            onclick="previousStation()">
            ⏮
        </button>

        <button
            id="mainPlay"
            class="main-play"
            onclick="togglePlay()">
            ▶
        </button>

        <button
            class="control"
            onclick="nextStation()">
            ⏭
        </button>

    </div>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <div
        class="nav-item active"
        onclick="goHome(this)">

        <div class="nav-icon">
            🏠
        </div>

        <div>
            Home
        </div>

    </div>


    <div
        class="nav-item"
        onclick="goMusic(this)">

        <div class="nav-icon">
            🎵
        </div>

        <div>
            Music
        </div>

    </div>


    <div
        class="nav-item"
        onclick="goFavorites(this)">

        <div class="nav-icon">
            ❤️
        </div>

        <div>
            Favorite
        </div>

    </div>


    <div
        class="nav-item"
        onclick="goRetro(this)">

        <div class="nav-icon">
            📚
        </div>

        <div>
            Library
        </div>

    </div>

</nav>


<!-- ================= TOAST ================= -->

<div
    id="toast"
    class="toast">
</div>


<!-- ================= AUDIO ================= -->

<audio
    id="audio"
    preload="none">
</audio>


<script>

/* =========================================================
   MADHU MUSIC WORLD
   ONLINE RADIO ENGINE
========================================================= */

const audio =
    document.getElementById("audio");

const stationsBox =
    document.getElementById("stations");

const playerName =
    document.getElementById("playerName");

const playerMeta =
    document.getElementById("playerMeta");

const playerLogo =
    document.getElementById("playerLogo");

const mainPlay =
    document.getElementById("mainPlay");

const sectionTitle =
    document.getElementById("sectionTitle");


let allStations = [];

let currentStations = [];

let currentIndex = -1;

let currentCategory = "all";

let currentStation = null;

let favorites =
    JSON.parse(
        localStorage.getItem("madhuFavorites") || "[]"
    );


/* =========================================================
   RADIO BROWSER SERVERS
========================================================= */

const API_SERVERS = [

    "https://all.api.radio-browser.info",

    "https://de1.api.radio-browser.info",

    "https://nl1.api.radio-browser.info"

];


/* =========================================================
   LOAD STATIONS
========================================================= */

async function loadStations(){

    stationsBox.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            <br>

            ভালো ভালো Radio Station খোঁজা হচ্ছে...

        </div>
    `;

    let result = [];

    for(const server of API_SERVERS){

        try{

            const url =
                server +
                "/json/stations/search" +
                "?hidebroken=true" +
                "&order=votes" +
                "&reverse=true" +
                "&limit=100" +
                "&hasExtendedInfo=true";

            const response =
                await fetch(url);

            if(!response.ok)
                continue;

            const data =
                await response.json();

            if(Array.isArray(data) && data.length){

                result = data;

                break;
            }

        }catch(error){

            console.log(
                "Radio server failed:",
                server
            );

        }

    }


    /* Only HTTPS stations */

    result =
        result.filter(station =>

            station.url_resolved &&

            station.url_resolved
            .startsWith("https://")

        );


    /* Remove duplicate stations */

    const seen =
        new Set();

    result =
        result.filter(station => {

            const key =
                station.stationuuid ||
                station.url_resolved;

            if(seen.has(key))
                return false;

            seen.add(key);

            return true;

        });


    allStations = result;


    if(!allStations.length){

        stationsBox.innerHTML = `

            <div class="empty">

                😔 এখন কোনো Online Station পাওয়া গেল না।

                <br><br>

                একটু পরে আবার চেষ্টা করুন।

            </div>

        `;

        return;
    }


    selectCategory(
        "all",
        document.querySelector(
            '[data-category="all"]'
        )
    );

}


/* =========================================================
   CATEGORY
========================================================= */

function selectCategory(category, button){

    currentCategory = category;


    document
    .querySelectorAll(".category")
    .forEach(btn => {

        btn.classList.remove("active");

    });


    if(button)
        button.classList.add("active");


    let filtered = [];


    if(category === "all"){

        filtered =
            allStations;

        sectionTitle.innerText =
            "🎵 All Stations";

    }


    else if(category === "bengali"){

        filtered =
            allStations.filter(station => {

                const text =
                    getStationText(station);

                return (

                    text.includes("bengali") ||

                    text.includes("bangla") ||

                    text.includes("kolkata") ||

                    text.includes("west bengal")

                );

            });

        sectionTitle.innerText =
            "🎶 Bengali Radio";

    }


    else if(category === "retro"){

        filtered =
            allStations.filter(station => {

                const text =
                    getStationText(station);

                return (

                    (
                        text.includes("bengali") ||
                        text.includes("bangla") ||
                        text.includes("kolkata") ||
                        text.includes("india")
                    )

                    &&

                    (
                        text.includes("old") ||
                        text.includes("retro") ||
                        text.includes("evergreen") ||
                        text.includes("80") ||
                        text.includes("90") ||
                        text.includes("70") ||
                        text.includes("classic") ||
                        text.includes("nostalgia") ||
                        text.includes("yesterday")

                    )

                );

            });

        sectionTitle.innerText =
            "🕰️ পুরোনো বাংলা গান • 70s • 80s • 90s";

    }


    else if(category === "hindi"){

        filtered =
            allStations.filter(station => {

                const text =
                    getStationText(station);

                return (

                    text.includes("hindi") ||

                    text.includes("bollywood")

                );

            });

        sectionTitle.innerText =
            "🎼 Hindi Radio";

    }


    else if(category === "english"){

        filtered =
            allStations.filter(station => {

                const text =
                    getStationText(station);

                return (

                    text.includes("english") ||

                    text.includes("oldies") ||

                    text.includes("classic rock") ||

                    text.includes("classic")

                );

            });

        sectionTitle.innerText =
            "🎸 English Retro";

    }


    else if(category === "favorite"){

        filtered =
            allStations.filter(station =>

                favorites.includes(
                    station.stationuuid
                )

            );

        sectionTitle.innerText =
            "❤️ My Favorite";

    }


    /* If retro has too few results,
       show Bengali stations and prioritize
       old/retro keywords */

    if(
        category === "retro" &&
        filtered.length < 3
    ){

        filtered =
            allStations
            .filter(station => {

                const text =
                    getStationText(station);

                return (

                    text.includes("bengali") ||
                    text.includes("bangla")

                );

            })
            .sort((a,b) => {

                return (
                    retroScore(b) -
                    retroScore(a)
                );

            })
            .slice(0,30);

    }


    currentStations = filtered;

    renderStations(currentStations);

}


/* =========================================================
   STATION TEXT
========================================================= */

function getStationText(station){

    return (

        (
            station.name || ""
        ) +

        " " +

        (
            station.language || ""
        ) +

        " " +

        (
            station.tags || ""
        )

    ).toLowerCase();

}


/* =========================================================
   RETRO SCORE
========================================================= */

function retroScore(station){

    const text =
        getStationText(station);

    let score = 0;

    const words = [

        "90",
        "80",
        "70",
        "old",
        "retro",
        "evergreen",
        "classic",
        "nostalgia",
        "yesterday"

    ];

    words.forEach(word => {

        if(text.includes(word))
            score += 5;

    });

    return score;

}


/* =========================================================
   RENDER STATIONS
========================================================= */

function renderStations(list){

    stationsBox.innerHTML = "";


    if(!list.length){

        stationsBox.innerHTML = `

            <div class="empty">

                😔 এই category-তে এখন কোনো
                suitable station পাওয়া গেল না।

                <br><br>

                অন্য category চেষ্টা করুন।

            </div>

        `;

        return;
    }


    list
    .slice(0,60)
    .forEach((station,index) => {

        const card =
            document.createElement("div");

        card.className =
            "station";


        const logo =
            document.createElement("div");

        logo.className =
            "station-logo";


        if(station.favicon){

            const img =
                document.createElement("img");

            img.src =
                station.favicon;

            img.onerror =
                function(){

                    this.remove();

                    logo.innerHTML =
                        "🎵";

                };

            logo.appendChild(img);

        }else{

            logo.innerHTML =
                "🎵";

        }


        const info =
            document.createElement("div");

        info.className =
            "station-info";


        const name =
            document.createElement("div");

        name.className =
            "station-name";

        name.innerText =
            station.name ||
            "Unknown Radio";


        const meta =
            document.createElement("div");

        meta.className =
            "station-meta";

        meta.innerText =

            (
                station.language ||
                "Online"
            ) +

            " • " +

            (
                station.country ||
                "Worldwide"
            );


        info.appendChild(name);

        info.appendChild(meta);


        const buttons =
            document.createElement("div");

        buttons.className =
            "station-buttons";


        const fav =
            document.createElement("button");

        fav.className =
            "favorite-btn";

        const isFav =
            favorites.includes(
                station.stationuuid
            );

        fav.classList.toggle(
            "active",
            isFav
        );

        fav.innerText =
            isFav ? "♥" : "♡";


        fav.onclick =
            function(event){

                event.stopPropagation();

                toggleFavorite(
                    station,
                    fav
                );

            };


        const play =
            document.createElement("button");

        play.className =
            "play-btn";

        play.innerText =
            "▶";


        play.onclick =
            function(){

                playStation(
                    station,
                    index,
                    currentStations
                );

            };


        buttons.appendChild(fav);

        buttons.appendChild(play);


        card.appendChild(logo);

        card.appendChild(info);

        card.appendChild(buttons);


        stationsBox.appendChild(card);

    });

}


/* =========================================================
   PLAY STATION
========================================================= */

function playStation(
    station,
    index,
    list
){

    if(!station.url_resolved){

        showToast(
            "এই station-এর stream পাওয়া যাচ্ছে না।"
        );

        return;
    }


    currentStation =
        station;

    currentIndex =
        index;

    currentStations =
        list;


    audio.src =
        station.url_resolved;


    audio.play()
    .then(() => {

        updatePlayer(true);

        showToast(
            "▶ " +
            station.name +
            " চলছে"
        );

    })
    .catch(error => {

        console.log(error);

        showToast(
            "এই station চালানো যাচ্ছে না। অন্য station চেষ্টা করুন।"
        );

        updatePlayer(false);

    });

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(isPlaying){

    if(!currentStation)
        return;


    playerName.innerText =
        currentStation.name ||
        "Radio Station";


    playerMeta.innerText =

        (
            currentStation.language ||
            "Online Radio"
        ) +

        " • " +

        (
            currentStation.country ||
            "Worldwide"
        );


    playerLogo.innerHTML =
        "🎧";


    mainPlay.innerText =
        isPlaying ? "⏸" : "▶";

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay(){

    if(!currentStation){

        showToast(
            "আগে একটি Radio Station নির্বাচন করুন।"
        );

        return;
    }


    if(audio.paused){

        audio.play()
        .then(() => {

            updatePlayer(true);

        })
        .catch(() => {

            showToast(
                "Station চালানো যাচ্ছে না।"
            );

        });

    }else{

        audio.pause();

        updatePlayer(false);

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextStation(){

    if(!currentStations.length){

        showToast(
            "কোনো station নেই।"
        );

        return;
    }


    let next =
        currentIndex + 1;


    if(next >= currentStations.length)
        next = 0;


    playStation(
        currentStations[next],
        next,
        currentStations
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousStation(){

    if(!currentStations.length){

        showToast(
            "কোনো station নেই।"
        );

        return;
    }


    let previous =
        currentIndex - 1;


    if(previous < 0)
        previous =
            currentStations.length - 1;


    playStation(
        currentStations[previous],
        previous,
        currentStations
    );

}


/* =========================================================
   AUTO NEXT WHEN STREAM ENDS
========================================================= */

audio.addEventListener(
    "ended",
    function(){

        nextStation();

    }
);


/* =========================================================
   FAVORITE
========================================================= */

function toggleFavorite(
    station,
    button
){

    const id =
        station.stationuuid;


    if(favorites.includes(id)){

        favorites =
            favorites.filter(
                x => x !== id
            );

        button.innerText =
            "♡";

        button.classList.remove(
            "active"
        );

        showToast(
            "Favorite থেকে সরানো হয়েছে"
        );

    }else{

        favorites.push(id);

        localStorage.setItem(
            "madhuFavorites",
            JSON.stringify(favorites)
        );

        button.innerText =
            "♥";

        button.classList.add(
            "active"
        );

        showToast(
            "❤️ Favorite-এ যোগ হয়েছে"
        );

    }

}


/* =========================================================
   SEARCH
========================================================= */

function searchStations(query){

    query =
        query.trim().toLowerCase();


    if(!query){

        selectCategory(
            currentCategory,
            document.querySelector(
                `[data-category="${currentCategory}"]`
            )
        );

        return;
    }


    const results =
        allStations.filter(station => {

            return getStationText(
                station
            ).includes(query);

        });


    currentStations =
        results;


    sectionTitle.innerText =
        "🔎 Search Result";


    renderStations(results);

}


/* =========================================================
   SEARCH BOX
========================================================= */

function toggleSearch(){

    const box =
        document.getElementById(
            "searchBox"
        );

    box.classList.toggle(
        "show"
    );


    if(box.classList.contains("show")){

        document
        .getElementById("searchInput")
        .focus();

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

function setNavActive(element){

    document
    .querySelectorAll(".nav-item")
    .forEach(item => {

        item.classList.remove(
            "active"
        );

    });

    if(element)
        element.classList.add(
            "active"
        );

}


function goHome(element){

    setNavActive(element);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    selectCategory(
        "all",
        document.querySelector(
            '[data-category="all"]'
        )
    );

}


function goMusic(element){

    setNavActive(element);

    document
    .querySelector(
        '[data-category="bengali"]'
    )
    .click();

    window.scrollTo({
        top:300,
        behavior:"smooth"
    });

}


function goFavorites(element){

    setNavActive(element);

    document
    .querySelector(
        '[data-category="favorite"]'
    )
    .click();

    window.scrollTo({
        top:300,
        behavior:"smooth"
    });

}


function goRetro(element){

    setNavActive(element);

    document
    .querySelector(
        '[data-category="retro"]'
    )
    .click();

    window.scrollTo({
        top:300,
        behavior:"smooth"
    });

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },3000);

}


/* =========================================================
   START
========================================================= */

loadStations();


</script>
