<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madhu Music World</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

:root{
--pink:#ff0099;
--pink2:#ff2bb5;
--dark:#07070d;
--card:#15151f;
--card2:#191923;
--text:#fff;
--muted:#9999a5;
}

body{
background:var(--dark);
color:var(--text);
padding-bottom:90px;
}

button{
font-family:inherit;
}

.app{
max-width:700px;
margin:auto;
padding:18px;
}

/* HEADER */

.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.logo{
font-size:30px;
font-weight:bold;
}

.logo span{
color:var(--pink);
}

.search-btn{
font-size:30px;
background:none;
border:0;
color:white;
cursor:pointer;
}

/* SEARCH */

.search-box{
display:none;
margin-bottom:18px;
}

.search-box.show{
display:block;
}

.search-box input{
width:100%;
padding:15px 18px;
border-radius:18px;
border:1px solid #343442;
background:#171720;
color:white;
font-size:16px;
outline:none;
}

.search-box input:focus{
border-color:var(--pink);
}

/* HERO */

.hero{
height:250px;
border-radius:32px;
padding:30px;
display:flex;
align-items:flex-end;
overflow:hidden;
position:relative;
background:
radial-gradient(circle at 75% 35%,#ff0099 0,#72005f 22%,transparent 45%),
linear-gradient(135deg,#25004d,#090015);
margin-bottom:22px;
}

.hero:after{
content:"🎧";
position:absolute;
right:35px;
top:45px;
font-size:120px;
opacity:.7;
}

.hero-text{
position:relative;
z-index:2;
}

.hero h2{
font-size:34px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
color:#ddd;
}

/* CATEGORIES */

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:28px;
}

.category{
min-height:75px;
border-radius:25px;
border:1px solid #323242;
background:#11111b;
color:white;
font-size:18px;
cursor:pointer;
transition:.2s;
}

.category:hover{
border-color:var(--pink);
}

.category.active{
background:linear-gradient(135deg,#ff0099,#c00078);
border-color:#ff46ba;
}

.category:nth-child(1){
grid-column:span 2;
}

/* PLAYER */

.player{
background:var(--card);
border:1px solid #2d2d3b;
border-radius:32px;
padding:28px 22px;
text-align:center;
margin-bottom:30px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.cover{
height:310px;
border-radius:26px;
display:flex;
align-items:center;
justify-content:center;
font-size:110px;
background:
radial-gradient(circle,#ff0099 0,#42005c 30%,#120020 70%);
margin-bottom:24px;
overflow:hidden;
}

.cover img{
width:100%;
height:100%;
object-fit:cover;
}

.title{
font-size:27px;
font-weight:bold;
line-height:1.2;
}

.artist{
color:var(--muted);
font-size:18px;
margin-top:10px;
}

.status{
color:var(--pink);
font-size:14px;
margin-top:8px;
}

.progress{
width:100%;
margin-top:25px;
accent-color:var(--pink);
}

.controls{
display:flex;
align-items:center;
justify-content:center;
gap:35px;
margin-top:28px;
}

.control{
border:0;
background:none;
color:white;
font-size:32px;
cursor:pointer;
}

.play{
width:78px;
height:78px;
border-radius:50%;
border:0;
background:var(--pink);
color:white;
font-size:30px;
cursor:pointer;
}

.favorite-main{
display:block;
margin:20px auto 0;
background:none;
border:0;
font-size:32px;
color:white;
cursor:pointer;
}

.favorite-main.active{
color:var(--pink);
}

/* STATION SECTION */

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 0 10px;
}

.section-title h2{
font-size:27px;
}

.online{
color:var(--pink);
}

#stationList{
margin-bottom:30px;
}

.station{
display:flex;
align-items:center;
gap:14px;
background:var(--card2);
border:1px solid #292936;
border-radius:22px;
padding:14px;
margin-top:12px;
cursor:pointer;
}

.station:hover{
border-color:var(--pink);
}

.station-logo{
height:58px;
width:58px;
border-radius:16px;
background:#292934;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
overflow:hidden;
flex-shrink:0;
}

.station-logo img{
width:100%;
height:100%;
object-fit:cover;
}

.station-info{
flex:1;
min-width:0;
}

.station-info h3{
font-size:17px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.station-info p{
color:var(--muted);
font-size:14px;
margin-top:5px;
}

.station-like{
font-size:24px;
background:none;
border:0;
color:white;
cursor:pointer;
}

.station-like.active{
color:var(--pink);
}

/* LOADING */

.loading{
text-align:center;
padding:30px 10px;
color:#aaa;
}

.spinner{
display:inline-block;
width:25px;
height:25px;
border:3px solid #444;
border-top-color:var(--pink);
border-radius:50%;
animation:spin 1s linear infinite;
vertical-align:middle;
margin-right:8px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.empty{
text-align:center;
color:#888;
padding:35px 10px;
}

/* NAVIGATION */

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:82px;
background:#12121b;
border-top:1px solid #292936;
display:flex;
justify-content:space-around;
align-items:center;
z-index:100;
}

.nav button{
background:none;
border:0;
color:#888;
font-size:14px;
cursor:pointer;
min-width:70px;
}

.nav-icon{
font-size:25px;
display:block;
margin-bottom:4px;
}

.nav button.active{
color:var(--pink);
}

/* TOAST */

.toast{
position:fixed;
left:50%;
bottom:100px;
transform:translateX(-50%) translateY(20px);
background:#252531;
padding:13px 20px;
border-radius:15px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:200;
white-space:nowrap;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:500px){

.app{
padding:16px;
}

.logo{
font-size:28px;
}

.hero{
height:230px;
padding:25px;
}

.hero h2{
font-size:29px;
}

.hero:after{
font-size:95px;
right:15px;
}

.cover{
height:285px;
}

.title{
font-size:25px;
}

.categories{
gap:10px;
}

.category{
font-size:16px;
}

.controls{
gap:28px;
}

}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

<div class="logo">
Madhu Music World <span>♫</span>
</div>

<button class="search-btn" onclick="toggleSearch()">🔍</button>

</header>


<!-- SEARCH -->

<div class="search-box" id="searchBox">

<input
type="search"
id="searchInput"
placeholder="Search station..."
oninput="searchStations()"
>

</div>


<!-- HOME HERO -->

<section class="hero">

<div class="hero-text">

<h2>Feel The Music</h2>

<p>Live Online Radio • Your Music World</p>

</div>

</section>


<!-- CATEGORY -->

<div class="categories">

<button class="category active" onclick="changeCategory('all',this)">
🎵 All Stations
</button>

<button class="category" onclick="changeCategory('bengali',this)">
🎶 Bengali
</button>

<button class="category" onclick="changeCategory('hindi',this)">
🎵 Hindi
</button>

<button class="category" onclick="changeCategory('rabindra',this)">
🎼 Rabindra Sangeet
</button>

<button class="category" onclick="changeCategory('bhajan',this)">
🕉️ Bhajan
</button>

</div>


<!-- PLAYER -->

<section class="player">

<div class="cover" id="cover">
🎧
</div>

<div class="title" id="title">
Select Station
</div>

<div class="artist" id="artist">
Online Music
</div>

<div class="status" id="status">
Choose a station below
</div>

<input
class="progress"
type="range"
id="progress"
min="0"
max="100"
value="0"
>

<div class="controls">

<button class="control" onclick="previousStation()">
⏮
</button>

<button class="play" id="playButton" onclick="playPause()">
▶
</button>

<button class="control" onclick="nextStation()">
⏭
</button>

</div>

<button
class="favorite-main"
id="mainFavorite"
onclick="toggleMainFavorite()"
>
♡
</button>

</section>


<!-- STATIONS -->

<div class="section-title">

<h2 id="sectionTitle">
All Stations
</h2>

<span class="online">
Online
</span>

</div>

<div id="stationList">

<div class="loading">
<span class="spinner"></span>
Loading stations...
</div>

</div>

</div>


<!-- BOTTOM NAV -->

<nav class="nav">

<button class="active" id="homeNav" onclick="goHome()">
<span class="nav-icon">⌂</span>
Home
</button>

<button id="musicNav" onclick="goMusic()">
<span class="nav-icon">♫</span>
Music
</button>

<button id="favoriteNav" onclick="showFavorites()">
<span class="nav-icon">♡</span>
Favorite
</button>

<button id="libraryNav" onclick="showLibrary()">
<span class="nav-icon">▱</span>
Library
</button>

</nav>


<!-- AUDIO -->

<audio id="audio" preload="none"></audio>

<div class="toast" id="toast"></div>


<script>

/* =========================
   MADHU MUSIC WORLD
   ONLINE RADIO PLAYER
========================= */

const audio = document.getElementById("audio");

const title = document.getElementById("title");
const artist = document.getElementById("artist");
const statusText = document.getElementById("status");
const cover = document.getElementById("cover");
const playButton = document.getElementById("playButton");
const progress = document.getElementById("progress");
const stationList = document.getElementById("stationList");
const sectionTitle = document.getElementById("sectionTitle");
const mainFavorite = document.getElementById("mainFavorite");

let stations = [];
let currentIndex = -1;
let currentCategory = "all";
let showingFavorites = false;


/* RADIO BROWSER SERVERS */

const radioServers = [

"https://all.api.radio-browser.info",

"https://de1.api.radio-browser.info",

"https://nl1.api.radio-browser.info"

];


/* CATEGORY SETTINGS */

const categorySettings = {

all:{
title:"All Stations",
params:"limit=40&hidebroken=true&order=clickcount&reverse=true"
},

bengali:{
title:"Bengali",
params:"language=Bengali&limit=40&hidebroken=true&order=clickcount&reverse=true"
},

hindi:{
title:"Hindi",
params:"language=Hindi&limit=40&hidebroken=true&order=clickcount&reverse=true"
},

rabindra:{
title:"Rabindra Sangeet",
params:"tag=rabindra%20sangeet&limit=40&hidebroken=true&order=clickcount&reverse=true"
},

bhajan:{
title:"Bhajan",
params:"tag=bhajan&limit=40&hidebroken=true&order=clickcount&reverse=true"
}

};


/* =========================
   FETCH STATIONS
========================= */

async function fetchStations(category){

stationList.innerHTML = `
<div class="loading">
<span class="spinner"></span>
Finding online stations...
</div>
`;

let setting = categorySettings[category];

let result = [];


/* Try all radio browser servers */

for(let server of radioServers){

try{

let url =
server +
"/json/stations/search?" +
setting.params;

let response = await fetch(url);

if(!response.ok) continue;

let data = await response.json();

if(Array.isArray(data)){
result = result.concat(data);
}

}catch(error){

console.log("Radio server error:",error);

}

}


/* Remove duplicates */

const unique = new Map();

result.forEach(station=>{

if(
station &&
station.stationuuid &&
station.name &&
station.url_resolved
){

if(!unique.has(station.stationuuid)){

unique.set(station.stationuuid,station);

}

}

});


stations = Array.from(unique.values());


/* HTTPS only */

stations = stations.filter(station=>{

return (
station.url_resolved &&
station.url_resolved.startsWith("https://")
);

});


renderStations();

}


/* =========================
   RENDER STATIONS
========================= */

function renderStations(){

if(stations.length === 0){

stationList.innerHTML = `
<div class="empty">

No online station found.<br><br>

Try another category.

</div>
`;

return;

}

stationList.innerHTML = "";

stations.forEach((station,index)=>{

let div = document.createElement("div");

div.className = "station";

div.onclick = function(){

selectStation(index);

};


let logo = station.favicon
? `<img src="${escapeHtml(station.favicon)}"
onerror="this.style.display='none'">`
: "🎧";


let favorite =
isFavorite(station.stationuuid)
? "♥"
: "♡";


div.innerHTML = `

<div class="station-logo">
${logo}
</div>

<div class="station-info">

<h3>
${escapeHtml(station.name)}
</h3>

<p>
${escapeHtml(
station.language ||
station.tags ||
"Online Radio"
)}
</p>

</div>

<button
class="station-like ${isFavorite(station.stationuuid) ? "active":""}"
onclick="event.stopPropagation();toggleFavorite('${station.stationuuid}')"
>
${favorite}
</button>

`;

stationList.appendChild(div);

});

}


/* =========================
   SELECT STATION
========================= */

function selectStation(index){

if(!stations[index]) return;

currentIndex = index;

let station = stations[index];

title.textContent = station.name;

artist.textContent =
station.language ||
station.tags ||
"Online Radio";

statusText.textContent = "Connecting...";

progress.value = 0;

cover.innerHTML = station.favicon
? `<img src="${escapeHtml(station.favicon)}"
onerror="this.parentElement.innerHTML='🎧'">`
: "🎧";


audio.src = station.url_resolved;

audio.play()
.then(()=>{

playButton.textContent = "❚❚";

statusText.textContent = "● LIVE";

})
.catch(error=>{

console.log(error);

statusText.textContent =
"Tap Play to start";

playButton.textContent = "▶";

});


updateMainFavorite();

}


/* =========================
   PLAY / PAUSE
========================= */

function playPause(){

if(!audio.src){

if(stations.length > 0){

selectStation(0);

}else{

showToast("আগে একটি station select করুন");

}

return;

}


if(audio.paused){

audio.play()
.then(()=>{

playButton.textContent = "❚❚";
statusText.textContent = "● LIVE";

})
.catch(()=>{

showToast("এই station এখন বাজানো যাচ্ছে না");

});

}else{

audio.pause();

playButton.textContent = "▶";

statusText.textContent = "Paused";

}

}


/* =========================
   PREVIOUS
========================= */

function previousStation(){

if(stations.length === 0) return;

if(currentIndex <= 0){

currentIndex = stations.length - 1;

}else{

currentIndex--;

}

selectStation(currentIndex);

}


/* =========================
   NEXT
========================= */

function nextStation(){

if(stations.length === 0) return;

if(currentIndex >= stations.length - 1){

currentIndex = 0;

}else{

currentIndex++;

}

selectStation(currentIndex);

}


/* =========================
   CATEGORY
========================= */

function changeCategory(category,button){

currentCategory = category;

showingFavorites = false;

document.querySelectorAll(".category").forEach(btn=>{

btn.classList.remove("active");

});

button.classList.add("active");

sectionTitle.textContent =
categorySettings[category].title;

fetchStations(category);

}


/* =========================
   SEARCH
========================= */

function toggleSearch(){

document
.getElementById("searchBox")
.classList.toggle("show");

if(
document
.getElementById("searchBox")
.classList.contains("show")
){

document.getElementById("searchInput").focus();

}

}


function searchStations(){

let query =
document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();


if(!query){

renderStations();

return;

}


let filtered =
stations.filter(station=>{

return (

(station.name || "")
.toLowerCase()
.includes(query)

||

(station.tags || "")
.toLowerCase()
.includes(query)

||

(station.language || "")
.toLowerCase()
.includes(query)

);

});


renderCustomStations(filtered);

}


function renderCustomStations(list){

stationList.innerHTML = "";

if(list.length === 0){

stationList.innerHTML =
`<div class="empty">No station found.</div>`;

return;

}

list.forEach((station)=>{

let index =
stations.indexOf(station);

let div =
document.createElement("div");

div.className = "station";

div.onclick=()=>{
selectStation(index);
};


let logo = station.favicon
? `<img src="${escapeHtml(station.favicon)}"
onerror="this.style.display='none'">`
: "🎧";


div.innerHTML = `

<div class="station-logo">
${logo}
</div>

<div class="station-info">

<h3>${escapeHtml(station.name)}</h3>

<p>
${escapeHtml(
station.language ||
station.tags ||
"Online Radio"
)}
</p>

</div>

<button
class="station-like ${isFavorite(station.stationuuid)?"active":""}"
onclick="event.stopPropagation();toggleFavorite('${station.stationuuid}')"
>
${isFavorite(station.stationuuid)?"♥":"♡"}
</button>

`;

stationList.appendChild(div);

});

}


/* =========================
   FAVORITES
========================= */

function getFavorites(){

try{

return JSON.parse(
localStorage.getItem("madhuFavorites") || "[]"
);

}catch{

return [];

}

}


function saveFavorites(list){

localStorage.setItem(
"madhuFavorites",
JSON.stringify(list)
);

}


function isFavorite(id){

return getFavorites().includes(id);

}


function toggleFavorite(id){

let favorites = getFavorites();

if(favorites.includes(id)){

favorites =
favorites.filter(x=>x!==id);

showToast("Favorite থেকে সরানো হয়েছে");

}else{

favorites.push(id);

showToast("Favorite-এ যোগ হয়েছে ❤️");

}

saveFavorites(favorites);

renderStations();

updateMainFavorite();

}


function toggleMainFavorite(){

if(currentIndex < 0 || !stations[currentIndex]){

showToast("আগে একটি station select করুন");

return;

}

toggleFavorite(
stations[currentIndex].stationuuid
);

}


function updateMainFavorite(){

if(
currentIndex >= 0 &&
stations[currentIndex]
){

if(
isFavorite(
stations[currentIndex].stationuuid
)
){

mainFavorite.textContent = "♥";

mainFavorite.classList.add("active");

}else{

mainFavorite.textContent = "♡";

mainFavorite.classList.remove("active");

}

}

}


/* =========================
   FAVORITE PAGE
========================= */

function showFavorites(){

setNav("favoriteNav");

showingFavorites = true;

sectionTitle.textContent =
"Favorite Stations";

let ids = getFavorites();

let list =
stations.filter(station=>
ids.includes(station.stationuuid)
);

if(list.length === 0){

stationList.innerHTML = `
<div class="empty">

এখনও কোনো Favorite station নেই ❤️

<br><br>

একটি station-এর পাশে ♡ চাপুন।

</div>
`;

return;

}

renderCustomStations(list);

}


/* =========================
   LIBRARY
========================= */

function showLibrary(){

setNav("libraryNav");

showingFavorites = true;

sectionTitle.textContent =
"My Library";

let ids = getFavorites();

let list =
stations.filter(station=>
ids.includes(station.stationuuid)
);

if(list.length === 0){

stationList.innerHTML = `
<div class="empty">

Your Library is empty 📂

<br><br>

Favorite করা station এখানে থাকবে।

</div>
`;

return;

}

renderCustomStations(list);

}


/* =========================
   HOME
========================= */

function goHome(){

setNav("homeNav");

showingFavorites = false;

document.getElementById("searchInput").value = "";

sectionTitle.textContent =
categorySettings[currentCategory].title;

fetchStations(currentCategory);

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   MUSIC
========================= */

function goMusic(){

setNav("musicNav");

showingFavorites = false;

document
.getElementById("searchBox")
.classList.add("show");

document
.getElementById("searchInput")
.focus();

}


/* =========================
   NAV ACTIVE
========================= */

function setNav(id){

document
.querySelectorAll(".nav button")
.forEach(btn=>{

btn.classList.remove("active");

});

document
.getElementById(id)
.classList.add("active");

}


/* =========================
   AUDIO EVENTS
========================= */

audio.addEventListener(
"playing",
()=>{

playButton.textContent = "❚❚";

statusText.textContent = "● LIVE";

}
);


audio.addEventListener(
"pause",
()=>{

playButton.textContent = "▶";

}
);


audio.addEventListener(
"error",
()=>{

statusText.textContent =
"Station unavailable";

playButton.textContent = "▶";

}
);


/* =========================
   TOAST
========================= */

function showToast(message){

let toast =
document.getElementById("toast");

toast.textContent = message;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},2200);

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   START APP
========================= */

fetchStations("all");

</script>

</body>
</html>
