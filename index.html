<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madhu Music World 🎵</title>

<meta name="description"
content="Madhu Music World - Bengali, Retro, Evergreen and Oldies Radio">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050509;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  padding-bottom:150px;
}

button{
  font-family:inherit;
}

.header{
  height:110px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 28px;
  border-bottom:1px solid #252532;
  background:#07070c;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:31px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  font-size:35px;
  margin-left:7px;
}

.searchBtn{
  width:62px;
  height:62px;
  border-radius:50%;
  border:1px solid #343444;
  background:#11111b;
  color:#fff;
  font-size:32px;
  cursor:pointer;
}

.container{
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:28px;
}

/* HERO */

.hero{
  position:relative;
  min-height:310px;
  border-radius:32px;
  overflow:hidden;
  border:1px solid #5b0d83;
  background:
    radial-gradient(circle at 75% 45%,#e900c9 0%,#7b00a9 22%,#28004b 52%,#100018 100%);
  box-shadow:
    0 0 35px rgba(255,0,220,.18),
    inset 0 0 70px rgba(255,0,220,.10);
  display:flex;
  align-items:center;
  padding:42px;
  margin-bottom:28px;
}

.hero:after{
  content:"🎧";
  position:absolute;
  right:7%;
  top:18%;
  font-size:120px;
  opacity:.18;
  transform:rotate(-7deg);
}

.heroText{
  position:relative;
  z-index:2;
  max-width:62%;
}

.hero h1{
  font-size:54px;
  line-height:1.05;
  margin-bottom:18px;
}

.hero p{
  color:#ddd;
  font-size:22px;
  line-height:1.4;
}

/* CATEGORY */

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:35px;
}

.category{
  min-height:125px;
  border:1px solid #2d2d3c;
  border-radius:22px;
  background:linear-gradient(145deg,#12121d,#0c0c14);
  color:#fff;
  cursor:pointer;
  padding:15px;
  transition:.2s;
}

.category:hover{
  transform:translateY(-3px);
  border-color:#ff00b8;
}

.category.active{
  background:linear-gradient(135deg,#ff009d,#b500ff);
  border-color:#ff39d0;
  box-shadow:0 0 25px rgba(255,0,190,.25);
}

.catIcon{
  display:block;
  font-size:37px;
  margin-bottom:8px;
}

.catTitle{
  font-size:18px;
  font-weight:700;
}

.catSub{
  color:#aaa;
  font-size:13px;
  margin-top:5px;
}

/* SECTION */

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 4px 16px;
}

.sectionTitle h2{
  font-size:28px;
}

.viewAll{
  color:#ff00b7;
  font-weight:bold;
  cursor:pointer;
}

/* STATIONS */

#stations{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.station{
  min-height:105px;
  border:1px solid #292936;
  border-radius:24px;
  background:linear-gradient(145deg,#12121c,#0d0d15);
  display:flex;
  align-items:center;
  padding:14px 16px;
  gap:17px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.stationLogo{
  width:72px;
  height:72px;
  min-width:72px;
  border-radius:20px;
  background:linear-gradient(135deg,#210052,#7000a8);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  overflow:hidden;
}

.stationLogo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stationInfo{
  flex:1;
  min-width:0;
}

.stationName{
  font-size:20px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stationMeta{
  color:#999;
  font-size:15px;
  margin-top:7px;
}

.stationButtons{
  display:flex;
  align-items:center;
  gap:10px;
}

.favBtn{
  width:44px;
  height:44px;
  border:0;
  background:transparent;
  color:#ff18b8;
  font-size:29px;
  cursor:pointer;
}

.playBtn{
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:linear-gradient(135deg,#ff009d,#ff00c8);
  color:#fff;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,0,180,.25);
}

.playBtn.playing{
  background:#7700ff;
}

/* LOADING */

.loading{
  text-align:center;
  color:#aaa;
  padding:35px;
  font-size:17px;
}

/* ERROR */

.errorBox{
  background:#17121c;
  border:1px solid #54214e;
  border-radius:20px;
  padding:22px;
  text-align:center;
  color:#ccc;
}

/* PLAYER */

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:72px;
  min-height:92px;
  background:rgba(14,14,23,.97);
  backdrop-filter:blur(15px);
  border-top:1px solid #30303d;
  z-index:90;
  display:flex;
  align-items:center;
  padding:10px 22px;
  gap:15px;
}

.playerIcon{
  width:62px;
  height:62px;
  border-radius:18px;
  background:linear-gradient(135deg,#280064,#7700b5);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  flex-shrink:0;
}

.playerInfo{
  flex:1;
  min-width:0;
}

.playerName{
  font-weight:bold;
  font-size:17px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.playerStatus{
  color:#aaa;
  margin-top:4px;
  font-size:13px;
}

.playerControls{
  display:flex;
  align-items:center;
  gap:10px;
}

.control{
  border:0;
  background:transparent;
  color:#fff;
  font-size:24px;
  cursor:pointer;
}

.mainControl{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#ff00ae;
  color:#fff;
  border:0;
  font-size:22px;
  cursor:pointer;
}

/* NAV */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#101018;
  border-top:1px solid #292934;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:100;
}

.navItem{
  border:0;
  background:transparent;
  color:#888;
  font-size:13px;
  cursor:pointer;
}

.navIcon{
  display:block;
  font-size:27px;
  margin-bottom:3px;
}

.navItem.active{
  color:#ff00b7;
}

/* SEARCH */

.searchPanel{
  display:none;
  margin-bottom:25px;
}

.searchPanel.show{
  display:block;
}

.searchInput{
  width:100%;
  padding:17px 20px;
  border-radius:18px;
  border:1px solid #393947;
  background:#12121b;
  color:#fff;
  font-size:17px;
  outline:none;
}

.searchInput:focus{
  border-color:#ff00b7;
}

/* MOBILE */

@media(max-width:700px){

  .header{
    height:95px;
    padding:15px 20px;
  }

  .logo{
    font-size:27px;
  }

  .logo span{
    font-size:31px;
  }

  .searchBtn{
    width:55px;
    height:55px;
    font-size:28px;
  }

  .container{
    padding:22px 18px;
  }

  .hero{
    min-height:300px;
    padding:30px 28px;
    border-radius:28px;
  }

  .heroText{
    max-width:100%;
  }

  .hero h1{
    font-size:43px;
  }

  .hero p{
    font-size:19px;
  }

  .hero:after{
    right:4%;
    top:12%;
    font-size:105px;
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .category{
    min-height:120px;
  }

  .station{
    padding:12px;
  }

  .stationLogo{
    width:62px;
    height:62px;
    min-width:62px;
  }

  .stationName{
    font-size:17px;
  }

  .stationMeta{
    font-size:13px;
  }

  .favBtn{
    display:none;
  }

  .playBtn{
    width:52px;
    height:52px;
  }

  .player{
    bottom:72px;
    padding:9px 14px;
  }

  .playerIcon{
    width:54px;
    height:54px;
  }

  .mainControl{
    width:54px;
    height:54px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Madhu Music World <span>🎵</span>
  </div>

  <button class="searchBtn" onclick="toggleSearch()">🔎</button>

</header>


<main class="container">

  <div id="searchPanel" class="searchPanel">
    <input
      id="searchInput"
      class="searchInput"
      type="search"
      placeholder="স্টেশনের নাম লিখে খুঁজুন..."
      oninput="searchStations()">
  </div>


  <!-- HERO -->

  <section class="hero">

    <div class="heroText">

      <h1>Feel The Music</h1>

      <p>
        Live Radio • Bengali • Retro • Evergreen
      </p>

    </div>

  </section>


  <!-- CATEGORY -->

  <div class="categories">

    <button class="category active" onclick="loadCategory('all',this)">
      <span class="catIcon">📻</span>
      <span class="catTitle">All Stations</span>
      <div class="catSub">Live Radio</div>
    </button>

    <button class="category" onclick="loadCategory('bengali',this)">
      <span class="catIcon">🎵</span>
      <span class="catTitle">Bengali</span>
      <div class="catSub">Bangla Radio</div>
    </button>

    <button class="category" onclick="loadCategory('old',this)">
      <span class="catIcon">🕰️</span>
      <span class="catTitle">Old Bengali</span>
      <div class="catSub">70s • 80s • 90s</div>
    </button>

    <button class="category" onclick="loadCategory('hindi',this)">
      <span class="catIcon">🎶</span>
      <span class="catTitle">Hindi Oldies</span>
      <div class="catSub">Retro Hits</div>
    </button>

    <button class="category" onclick="loadCategory('english',this)">
      <span class="catIcon">🎸</span>
      <span class="catTitle">English Retro</span>
      <div class="catSub">Classic Hits</div>
    </button>

    <button class="category" onclick="loadCategory('rabindra',this)">
      <span class="catIcon">🎼</span>
      <span class="catTitle">Rabindra Sangeet</span>
      <div class="catSub">রবীন্দ্রসঙ্গীত</div>
    </button>

    <button class="category" onclick="loadCategory('bhajan',this)">
      <span class="catIcon">🕉️</span>
      <span class="catTitle">Bhajan</span>
      <div class="catSub">Devotional</div>
    </button>

    <button class="category" onclick="showFavorites()">
      <span class="catIcon">💜</span>
      <span class="catTitle">My Favorite</span>
      <div class="catSub">Saved Stations</div>
    </button>

  </div>


  <div class="sectionTitle">

    <h2 id="sectionHeading">
      Popular Stations
    </h2>

    <span class="viewAll" onclick="loadCategory('all',null)">
      View All ›
    </span>

  </div>


  <div id="stations">

    <div class="loading">
      🎵 লাইভ স্টেশন খোঁজা হচ্ছে...
    </div>

  </div>

</main>


<!-- PLAYER -->

<div class="player">

  <div class="playerIcon" id="playerIcon">
    🎧
  </div>

  <div class="playerInfo">

    <div class="playerName" id="playerName">
      কোনো স্টেশন চলছে না
    </div>

    <div class="playerStatus" id="playerStatus">
      একটি Radio Station নির্বাচন করুন
    </div>

  </div>

  <div class="playerControls">

    <button class="control" onclick="previousStation()">
      ⏮
    </button>

    <button
      class="mainControl"
      id="mainPlay"
      onclick="togglePlayer()">
      ▶
    </button>

    <button class="control" onclick="nextStation()">
      ⏭
    </button>

  </div>

</div>


<!-- AUDIO -->

<audio id="audio" preload="none"></audio>


<!-- NAV -->

<nav class="bottomNav">

  <button class="navItem active" onclick="goHome(this)">
    <span class="navIcon">🏠</span>
    Home
  </button>

  <button class="navItem" onclick="loadCategory('all',this)">
    <span class="navIcon">🎵</span>
    Music
  </button>

  <button class="navItem" onclick="showFavorites(this)">
    <span class="navIcon">❤️</span>
    Favorite
  </button>

  <button class="navItem" onclick="loadCategory('old',this)">
    <span class="navIcon">📚</span>
    Library
  </button>

</nav>


<script>

/* =========================================
   MADHU MUSIC WORLD
   LIVE RADIO ENGINE
========================================= */

const audio = document.getElementById("audio");

const stationsBox = document.getElementById("stations");

const playerName = document.getElementById("playerName");

const playerStatus = document.getElementById("playerStatus");

const playerIcon = document.getElementById("playerIcon");

const mainPlay = document.getElementById("mainPlay");

const sectionHeading = document.getElementById("sectionHeading");


let stations = [];

let currentStation = null;

let currentIndex = -1;

let currentCategory = "all";

let favorites =
  JSON.parse(localStorage.getItem("madhuFavorites") || "[]");


/*
 Radio Browser has several public servers.
 If one server fails, the next one is tried.
*/

const API_SERVERS = [

  "https://de1.api.radio-browser.info",
  "https://nl1.api.radio-browser.info",
  "https://at1.api.radio-browser.info",
  "https://fr1.api.radio-browser.info"

];


/* =========================================
   API REQUEST
========================================= */

async function apiRequest(path){

  for(const server of API_SERVERS){

    try{

      const response =
        await fetch(server + path,{
          method:"GET",
          headers:{
            "Accept":"application/json"
          }
        });

      if(response.ok){

        return await response.json();

      }

    }catch(error){

      console.log(
        "Radio server failed:",
        server
      );

    }

  }

  throw new Error("All radio servers failed");

}


/* =========================================
   LOAD STATIONS
========================================= */

async function loadCategory(category="all",button=null){

  currentCategory = category;

  if(button){

    document
      .querySelectorAll(".category")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

  }

  stationsBox.innerHTML =
    `<div class="loading">
       ⏳ লাইভ স্টেশন খোঁজা হচ্ছে...
     </div>`;

  let query =
    "/json/stations/search" +
    "?limit=40" +
    "&hidebroken=true" +
    "&order=votes" +
    "&reverse=true";

  if(category === "bengali"){

    query += "&language=Bengali";

  }

  else if(category === "old"){

    query += "&tag=oldies";

  }

  else if(category === "hindi"){

    query += "&language=Hindi&tag=oldies";

  }

  else if(category === "english"){

    query += "&language=English&tag=oldies";

  }

  else if(category === "rabindra"){

    query += "&name=Rabindra";

  }

  else if(category === "bhajan"){

    query += "&tag=bhajan";

  }

  try{

    let data = await apiRequest(query);

    /*
      Remove stations without usable stream URLs
    */

    data = data.filter(
      s => s.url_resolved || s.url
    );

    stations = data;

    sectionHeading.textContent =
      categoryTitle(category);

    renderStations();

  }

  catch(error){

    stationsBox.innerHTML = `
      <div class="errorBox">

        ❌ এখন Radio Server থেকে Station পাওয়া যাচ্ছে না।

        <br><br>

        একটু পরে আবার চেষ্টা করুন।

        <br><br>

        <button
          onclick="loadCategory('${category}')"
          style="
            background:#ff00ad;
            color:#fff;
            border:0;
            border-radius:15px;
            padding:12px 22px;
            font-weight:bold;
          ">
          🔄 আবার চেষ্টা করুন
        </button>

      </div>
    `;

  }

}


/* =========================================
   TITLES
========================================= */

function categoryTitle(category){

  const titles = {

    all:"Popular Stations",

    bengali:"Bengali Stations",

    old:"পুরোনো বাংলা গান • 70s • 80s • 90s",

    hindi:"Hindi Retro Stations",

    english:"English Retro Stations",

    rabindra:"Rabindra Sangeet",

    bhajan:"Bhajan Stations"

  };

  return titles[category] || "Radio Stations";

}


/* =========================================
   RENDER
========================================= */

function renderStations(list=stations){

  if(!list.length){

    stationsBox.innerHTML = `
      <div class="errorBox">
        😔 এই বিভাগে এখন কোনো Station পাওয়া গেল না।
      </div>
    `;

    return;

  }


  stationsBox.innerHTML = "";


  list.forEach((station,index)=>{

    const div =
      document.createElement("div");

    div.className = "station";


    const logo =
      station.favicon ||
      station.favicon_url ||
      "";


    const isFav =
      favorites.includes(station.stationuuid);


    div.innerHTML = `

      <div class="stationLogo">

        ${
          logo
          ?
          `<img
             src="${escapeHTML(logo)}"
             onerror="this.style.display='none'"
           >`
          :
          "🎵"
        }

      </div>


      <div class="stationInfo">

        <div class="stationName">
          ${escapeHTML(
            station.name || "Unknown Radio"
          )}
        </div>

        <div class="stationMeta">

          ${escapeHTML(
            station.language ||
            station.tags ||
            "Online Radio"
          )}

          ${
            station.country
            ?
            " • " +
            escapeHTML(station.country)
            :
            ""
          }

        </div>

      </div>


      <div class="stationButtons">

        <button
          class="favBtn"
          onclick="toggleFavorite('${station.stationuuid}')">

          ${isFav ? "♥" : "♡"}

        </button>


        <button
          class="playBtn"
          id="play-${index}"
          onclick="playStation(${index})">

          ▶

        </button>

      </div>

    `;


    stationsBox.appendChild(div);

  });

}


/* =========================================
   PLAY STATION
========================================= */

async function playStation(index){

  if(!stations[index]) return;


  const station =
    stations[index];


  const stream =
    station.url_resolved ||
    station.url;


  if(!stream){

    alert("এই স্টেশনের stream পাওয়া যায়নি।");

    return;

  }


  currentStation = station;

  currentIndex = index;


  /*
    Radio Browser click endpoint.
    This also helps maintain station popularity.
  */

  if(station.stationuuid){

    try{

      fetch(
        "https://de1.api.radio-browser.info/json/url/" +
        station.stationuuid
      ).catch(()=>{});

    }catch(e){}

  }


  playerName.textContent =
    station.name || "Radio Station";


  playerStatus.textContent =
    "🔴 Live Radio";


  if(station.favicon){

    playerIcon.innerHTML =
      `<img
        src="${escapeHTML(station.favicon)}"
        style="
          width:100%;
          height:100%;
          object-fit:cover;
          border-radius:18px;
        "
      >`;

  }else{

    playerIcon.textContent = "🎧";

  }


  /*
    Stop old station
  */

  audio.pause();

  audio.src = stream;

  audio.load();


  try{

    await audio.play();

    mainPlay.textContent = "⏸";

    updatePlayingButtons();

  }

  catch(error){

    console.log(error);

    playerStatus.textContent =
      "⚠️ এই stream এখন চলছে না";

    mainPlay.textContent = "▶";

    /*
      Some radio servers need a second click
    */

    alert(
      "এই Station-টি এই মুহূর্তে offline হতে পারে। অন্য Station চেষ্টা করুন।"
    );

  }

}


/* =========================================
   PLAYER TOGGLE
========================================= */

function togglePlayer(){

  if(!currentStation){

    if(stations.length){

      playStation(0);

    }

    return;

  }


  if(audio.paused){

    audio.play()
      .then(()=>{

        mainPlay.textContent = "⏸";

      })
      .catch(()=>{

        mainPlay.textContent = "▶";

      });

  }

  else{

    audio.pause();

    mainPlay.textContent = "▶";

    playerStatus.textContent =
      "⏸ Paused";

  }

}


/* =========================================
   NEXT
========================================= */

function nextStation(){

  if(!stations.length) return;

  let next =
    currentIndex + 1;

  if(next >= stations.length){

    next = 0;

  }

  playStation(next);

}


/* =========================================
   PREVIOUS
========================================= */

function previousStation(){

  if(!stations.length) return;

  let previous =
    currentIndex - 1;

  if(previous < 0){

    previous =
      stations.length - 1;

  }

  playStation(previous);

}


/* =========================================
   PLAYING BUTTON
========================================= */

function updatePlayingButtons(){

  document
    .querySelectorAll(".playBtn")
    .forEach(btn=>{

      btn.classList.remove("playing");

      btn.textContent = "▶";

    });


  if(currentIndex >= 0){

    const btn =
      document.getElementById(
        "play-" + currentIndex
      );

    if(btn){

      btn.classList.add("playing");

      btn.textContent = "⏸";

    }

  }

}


/* =========================================
   FAVORITES
========================================= */

function toggleFavorite(uuid){

  if(favorites.includes(uuid)){

    favorites =
      favorites.filter(
        id => id !== uuid
      );

  }

  else{

    favorites.push(uuid);

  }


  localStorage.setItem(
    "madhuFavorites",
    JSON.stringify(favorites)
  );


  renderStations();

}


/* =========================================
   SHOW FAVORITES
========================================= */

function showFavorites(button=null){

  if(button){

    document
      .querySelectorAll(".navItem")
      .forEach(b =>
        b.classList.remove("active")
      );

    button.classList.add("active");

  }


  const favStations =
    stations.filter(
      s => favorites.includes(s.stationuuid)
    );


  sectionHeading.textContent =
    "My Favorite";


  renderStations(favStations);

}


/* =========================================
   SEARCH
========================================= */

function toggleSearch(){

  const panel =
    document.getElementById(
      "searchPanel"
    );

  panel.classList.toggle("show");

  if(panel.classList.contains("show")){

    document
      .getElementById("searchInput")
      .focus();

  }

}


function searchStations(){

  const value =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  if(!value){

    renderStations();

    return;

  }


  const result =
    stations.filter(station =>

      (
        station.name +
        " " +
        station.tags +
        " " +
        station.language +
        " " +
        station.country
      )
      .toLowerCase()
      .includes(value)

    );


  renderStations(result);

}


/* =========================================
   HOME
========================================= */

function goHome(button){

  document
    .querySelectorAll(".navItem")
    .forEach(b =>
      b.classList.remove("active")
    );

  if(button){

    button.classList.add("active");

  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  loadCategory("all");

}


/* =========================================
   AUDIO EVENTS
========================================= */

audio.addEventListener(
  "playing",
  ()=>{

    mainPlay.textContent = "⏸";

    playerStatus.textContent =
      "🔴 Live Radio";

    updatePlayingButtons();

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    mainPlay.textContent = "▶";

    updatePlayingButtons();

  }
);


audio.addEventListener(
  "error",
  ()=>{

    if(currentStation){

      playerStatus.textContent =
        "⚠️ Stream unavailable";

      mainPlay.textContent =
        "▶";

    }

  }
);


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value){

  if(!value) return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   START APP
========================================= */

loadCategory("all");

</script>
