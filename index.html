<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Madhu Music World</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#09090d;
color:white;
padding-bottom:90px;
}

.app{
max-width:500px;
margin:auto;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
font-size:28px;
}

.search-btn{
border:0;
background:none;
color:white;
font-size:28px;
cursor:pointer;
}

.search-box{
display:none;
margin-top:15px;
}

.search-box.active{
display:block;
}

.search-box input{
width:100%;
padding:13px 15px;
border-radius:15px;
border:1px solid #333;
background:#171720;
color:white;
font-size:16px;
outline:none;
}

.categories{
display:flex;
gap:10px;
margin-top:20px;
overflow-x:auto;
padding-bottom:5px;
}

.categories button{
background:#171720;
color:white;
border:0;
border-radius:20px;
padding:10px 15px;
font-size:14px;
white-space:nowrap;
cursor:pointer;
}

.categories button.active{
background:white;
color:black;
}

.card{
background:#171720;
border-radius:30px;
padding:20px;
margin-top:20px;
text-align:center;
}

.cover{
height:280px;
border-radius:25px;
background:linear-gradient(135deg,#444,#111);
display:flex;
align-items:center;
justify-content:center;
font-size:95px;
}

.title{
font-size:25px;
font-weight:bold;
margin-top:20px;
}

.artist{
color:#999;
margin-top:8px;
}

input[type="range"]{
width:100%;
margin-top:20px;
accent-color:#4da3ff;
cursor:pointer;
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:25px;
margin-top:25px;
}

.controls button{
border:0;
background:none;
color:white;
font-size:30px;
cursor:pointer;
}

.play{
background:white !important;
color:black !important;
height:70px;
width:70px;
border-radius:50%;
font-size:28px !important;
}

.list{
margin-top:30px;
}

.list h2{
font-size:27px;
}

.song{
display:flex;
align-items:center;
background:#171720;
padding:15px;
border-radius:20px;
margin-top:15px;
cursor:pointer;
}

.song:active{
transform:scale(.98);
}

.pic{
height:55px;
width:55px;
background:#292933;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
margin-right:15px;
overflow:hidden;
}

.pic img{
width:100%;
height:100%;
object-fit:cover;
}

.info{
flex:1;
}

.info h3{
font-size:16px;
}

.info p{
color:#888;
font-size:13px;
margin-top:5px;
}

.like{
font-size:24px;
padding:8px;
background:none;
border:0;
color:white;
cursor:pointer;
}

.like.active{
color:red;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:75px;
background:#15151b;
display:flex;
justify-content:space-around;
align-items:center;
z-index:1000;
}

.nav-item{
text-align:center;
font-size:14px;
color:#aaa;
cursor:pointer;
}

.nav-item div{
font-size:24px;
}

.nav-item.active{
color:#4da3ff;
}

.loading{
text-align:center;
color:#888;
padding:30px 10px;
}

.empty{
text-align:center;
color:#777;
padding:30px 10px;
}

</style>

</head>


<body>


<div class="app">


<!-- HEADER -->

<div class="header">

<h1>Madhu Music World 🎵</h1>

<button
class="search-btn"
onclick="toggleSearch()"
>
🔍
</button>

</div>


<!-- SEARCH -->

<div
class="search-box"
id="searchBox"
>

<input
type="text"
id="searchInput"
placeholder="Search music..."
oninput="searchMusic()"
>

</div>


<!-- CATEGORIES -->

<div class="categories">

<button
id="bengaliBtn"
class="active"
onclick="loadCategory('bengali')"
>
🇮🇳 Bengali
</button>

<button
id="hindiBtn"
onclick="loadCategory('hindi')"
>
🇮🇳 Hindi
</button>

<button
id="rabindraBtn"
onclick="loadCategory('rabindra')"
>
🎼 Rabindra Sangeet
</button>

<button
id="bhajanBtn"
onclick="loadCategory('bhajan')"
>
🕉️ Bhajan
</button>

<button
id="allBtn"
onclick="loadCategory('all')"
>
🎵 All
</button>

</div>


<!-- PLAYER -->

<div class="card">

<div class="cover">
🎧
</div>

<div
class="title"
id="title"
>
Select Music
</div>

<div
class="artist"
id="artist"
>
Choose a station
</div>

<input
type="range"
id="progress"
min="0"
max="100"
value="0"
>

<div class="controls">

<button onclick="previous()">
⏮
</button>

<button
class="play"
id="play"
onclick="playPause()"
>
▶
</button>

<button onclick="next()">
⏭
</button>

</div>

</div>


<!-- SONG LIST -->

<div
class="list"
id="musicList"
>

<h2 id="listTitle">
Bengali Music
</h2>

<div id="songs">

<div class="loading">
Loading online music...
</div>

</div>

</div>


</div>


<!-- NAVIGATION -->

<div class="nav">

<div
class="nav-item active"
id="homeNav"
onclick="goHome()"
>
<div>🏠</div>
Home
</div>

<div
class="nav-item"
id="musicNav"
onclick="goMusic()"
>
<div>🎵</div>
Music
</div>

<div
class="nav-item"
id="favoriteNav"
onclick="showFavorites()"
>
<div>❤️</div>
Favorite
</div>

<div
class="nav-item"
id="libraryNav"
onclick="showLibrary()"
>
<div>📂</div>
Library
</div>

</div>


<audio id="audio"></audio>


<script>


/* =========================
   VARIABLES
========================= */

let stations = [];

let currentList = [];

let currentIndex = 0;

let currentCategory = "bengali";

let favorites =
JSON.parse(
localStorage.getItem(
"madhuFavorites"
) || "[]"
);


const audio =
document.getElementById("audio");

const playButton =
document.getElementById("play");

const title =
document.getElementById("title");

const artist =
document.getElementById("artist");

const progress =
document.getElementById("progress");

const songsBox =
document.getElementById("songs");



/* =========================
   RADIO BROWSER SERVERS
========================= */

const servers = [

"https://de1.api.radio-browser.info",

"https://nl1.api.radio-browser.info",

"https://at1.api.radio-browser.info"

];



/* =========================
   LOAD ALL STATIONS
========================= */

async function loadStations(){

songsBox.innerHTML =
`
<div class="loading">
Loading online music...
</div>
`;

let all = [];

try{

for(
const server of servers
){

const url =
server +
"/json/stations/search" +
"?countrycode=IN" +
"&hidebroken=true" +
"&order=votes" +
"&reverse=true" +
"&limit=100";

try{

const response =
await fetch(url);

if(!response.ok){
continue;
}

const data =
await response.json();

all =
all.concat(data);

}catch(error){

console.log(
"Server error",
server
);

}

if(all.length >= 100){
break;
}

}


stations =
removeDuplicates(all);

loadCategory("bengali");

}catch(error){

console.log(error);

songsBox.innerHTML =
`
<div class="empty">
Internet connection problem.
<br><br>
Please try again.
</div>
`;

}

}



/* =========================
   REMOVE DUPLICATES
========================= */

function removeDuplicates(list){

const seen = new Set();

return list.filter(
station=>{

const id =
station.stationuuid ||
station.url_resolved ||
station.url;

if(!id){
return false;
}

if(seen.has(id)){
return false;
}

seen.add(id);

return true;

});

}



/* =========================
   CATEGORY
========================= */

function loadCategory(category){

currentCategory =
category;

setCategoryButton(category);

let result = [];


if(category === "bengali"){

result =
stations.filter(
station=>{

const text =
getStationText(station);

return (
text.includes("bengali") ||
text.includes("bangla") ||
text.includes("kolkata") ||
text.includes("west bengal")
);

});

document.getElementById(
"listTitle"
).textContent =
"Bengali Music";

}


else if(category === "hindi"){

result =
stations.filter(
station=>{

const text =
getStationText(station);

return (
text.includes("hindi") ||
text.includes("bollywood")
);

});

document.getElementById(
"listTitle"
).textContent =
"Hindi Music";

}


else if(category === "rabindra"){

result =
stations.filter(
station=>{

const text =
getStationText(station);

return (
text.includes("rabindra") ||
text.includes("tagore") ||
text.includes("geetanjali")
);

});

document.getElementById(
"listTitle"
).textContent =
"Rabindra Sangeet";

}


else if(category === "bhajan"){

result =
stations.filter(
station=>{

const text =
getStationText(station);

return (
text.includes("bhajan") ||
text.includes("devotional") ||
text.includes("devotion") ||
text.includes("spiritual")
);

});

document.getElementById(
"listTitle"
).textContent =
"Bhajan";

}


else{

result =
stations;

document.getElementById(
"listTitle"
).textContent =
"All Music";

}


currentList =
result.slice(0,50);

renderStations();

}



/* =========================
   STATION TEXT
========================= */

function getStationText(station){

return (

(station.name || "") +
" " +
(station.language || "") +
" " +
(station.tags || "") +
" " +
(station.country || "") +
" " +
(station.state || "")

).toLowerCase();

}



/* =========================
   RENDER
========================= */

function renderStations(){

songsBox.innerHTML = "";

if(currentList.length === 0){

songsBox.innerHTML =
`
<div class="empty">
এই category-তে এখন কোনো
online station পাওয়া যায়নি।
<br><br>
অন্য category চেষ্টা করুন।
</div>
`;

return;

}


currentList.forEach(
(station,index)=>{

const div =
document.createElement("div");

div.className = "song";


let image = "🎵";


if(station.favicon){

image =
`
<img
src="${escapeHTML(
station.favicon
)}"
onerror="
this.style.display='none';
"
>
`;

}


const favorite =
favorites.includes(
station.stationuuid
);


div.innerHTML = `

<div class="pic">
${image}
</div>

<div class="info">

<h3>
${escapeHTML(
station.name ||
"Online Music"
)}
</h3>

<p>
${escapeHTML(
station.language ||
station.country ||
"Online Station"
)}
</p>

</div>

<button
class="like ${favorite ? "active" : ""}"
onclick="
toggleFavorite(event,${index})
"
>
${favorite ? "❤️" : "♡"}
</button>

`;


div.addEventListener(
"click",
function(){

playStation(index);

});


songsBox.appendChild(div);

});

}



/* =========================
   PLAY STATION
========================= */

function playStation(index){

const station =
currentList[index];

if(!station){
return;
}

currentIndex =
index;


const stream =
station.url_resolved ||
station.url;


if(!stream){

alert(
"এই station-এর playable stream পাওয়া যায়নি।"
);

return;

}


audio.src =
stream;


title.textContent =
station.name ||
"Online Music";


artist.textContent =
station.language ||
station.country ||
"Online Radio";


audio.play()
.then(
function(){

playButton.textContent =
"⏸";

}
)
.catch(
function(){

playButton.textContent =
"▶";

alert(
"এই station এখন চালানো যাচ্ছে না। অন্য station চেষ্টা করুন।"
);

}
);

}



/* =========================
   PLAY PAUSE
========================= */

function playPause(){

if(!audio.src){

if(currentList.length > 0){

playStation(
currentIndex
);

}

return;

}


if(audio.paused){

audio.play()
.then(
function(){

playButton.textContent =
"⏸";

}
);

}else{

audio.pause();

playButton.textContent =
"▶";

}

}



/* =========================
   NEXT
========================= */

function next(){

if(currentList.length === 0){
return;
}

currentIndex++;

if(
currentIndex >=
currentList.length
){

currentIndex = 0;

}

playStation(
currentIndex
);

}



/* =========================
   PREVIOUS
========================= */

function previous(){

if(currentList.length === 0){
return;
}

currentIndex--;

if(currentIndex < 0){

currentIndex =
currentList.length - 1;

}

playStation(
currentIndex
);

}



/* =========================
   AUDIO EVENTS
========================= */

audio.addEventListener(
"play",
function(){

playButton.textContent =
"⏸";

});


audio.addEventListener(
"pause",
function(){

playButton.textContent =
"▶";

});


audio.addEventListener(
"ended",
function(){

next();

});


audio.addEventListener(
"timeupdate",
function(){

if(
audio.duration &&
isFinite(audio.duration)
){

progress.value =
(
audio.currentTime /
audio.duration
) * 100;

}

});



/* =========================
   PROGRESS
========================= */

progress.addEventListener(
"input",
function(){

if(
audio.duration &&
isFinite(audio.duration)
){

audio.currentTime =
(
progress.value / 100
) *
audio.duration;

}

});



/* =========================
   SEARCH
========================= */

function toggleSearch(){

const box =
document.getElementById(
"searchBox"
);

box.classList.toggle(
"active"
);

if(
box.classList.contains(
"active"
)
){

document
.getElementById(
"searchInput"
)
.focus();

}

}


function searchMusic(){

const query =
document
.getElementById(
"searchInput"
)
.value
.toLowerCase()
.trim();


if(query === ""){

loadCategory(
currentCategory
);

return;

}


const result =
stations.filter(
station=>{

return getStationText(
station
).includes(query);

});


currentList =
result.slice(0,50);


document.getElementById(
"listTitle"
).textContent =
"Search Results";


renderStations();

}



/* =========================
   FAVORITE
========================= */

function toggleFavorite(
event,
index
){

event.stopPropagation();

const station =
currentList[index];

if(!station){
return;
}


const id =
station.stationuuid;


if(favorites.includes(id)){

favorites =
favorites.filter(
item => item !== id
);

}else{

favorites.push(id);

}


localStorage.setItem(
"madhuFavorites",
JSON.stringify(
favorites
)
);


renderStations();

}



/* =========================
   FAVORITES
========================= */

function showFavorites(){

setActive(
"favoriteNav"
);

document.getElementById(
"listTitle"
).textContent =
"Favorite Music";


currentList =
stations.filter(
station =>
favorites.includes(
station.stationuuid
)
);


renderStations();

scrollToList();

}



/* =========================
   LIBRARY
========================= */

function showLibrary(){

setActive(
"libraryNav"
);

document.getElementById(
"listTitle"
).textContent =
"My Library";


currentList =
stations.slice(0,50);

renderStations();

scrollToList();

}



/* =========================
   HOME
========================= */

function goHome(){

setActive(
"homeNav"
);

loadCategory(
"bengali"
);

window.scrollTo({

top:0,

behavior:"smooth"

});

}



/* =========================
   MUSIC
========================= */

function goMusic(){

setActive(
"musicNav"
);

scrollToList();

}



/* =========================
   CATEGORY BUTTON
========================= */

function setCategoryButton(
category
){

document
.querySelectorAll(
".categories button"
)
.forEach(
button =>
button.classList.remove(
"active"
)
);


if(category === "bengali"){

document.getElementById(
"bengaliBtn"
).classList.add(
"active"
);

}

else if(category === "hindi"){

document.getElementById(
"hindiBtn"
).classList.add(
"active"
);

}

else if(category === "rabindra"){

document.getElementById(
"rabindraBtn"
).classList.add(
"active"
);

}

else if(category === "bhajan"){

document.getElementById(
"bhajanBtn"
).classList.add(
"active"
);

}

else{

document.getElementById(
"allBtn"
).classList.add(
"active"
);

}

}



/* =========================
   NAV ACTIVE
========================= */

function setActive(id){

document
.querySelectorAll(
".nav-item"
)
.forEach(
item =>
item.classList.remove(
"active"
)
);


document
.getElementById(id)
.classList.add(
"active"
);

}



/* =========================
   SCROLL
========================= */

function scrollToList(){

document
.getElementById(
"musicList"
)
.scrollIntoView({

behavior:"smooth"

});

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}



/* =========================
   START
========================= */

loadStations();


</script>


</body>

</html>
