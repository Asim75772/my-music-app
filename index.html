<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madhu Music World</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05050b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:170px;
}

button{
    font-family:inherit;
}

.header{
    height:90px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid #242331;
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(5,5,11,.94);
    backdrop-filter:blur(15px);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:30px;
    font-weight:700;
}

.logo span{
    color:#ff00a8;
    font-size:38px;
}

.menu{
    font-size:36px;
    cursor:pointer;
}

.search{
    width:58px;
    height:58px;
    border-radius:50%;
    border:1px solid #363445;
    background:#11111b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    cursor:pointer;
}

/* HERO */

.hero{
    margin:28px 3%;
    min-height:285px;
    border-radius:30px;
    border:1px solid #ff00a8;
    background:
      radial-gradient(circle at 78% 45%,#d600a7 0%,#5a007c 30%,#150022 65%,#08000e 100%);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    padding:40px;
    box-shadow:0 0 35px rgba(255,0,168,.18);
}

.hero:after{
    content:"🎧";
    position:absolute;
    right:7%;
    top:20px;
    font-size:150px;
    opacity:.8;
    filter:drop-shadow(0 0 25px #ff00b7);
}

.heroText{
    position:relative;
    z-index:2;
}

.hero h1{
    font-size:60px;
    margin-bottom:16px;
}

.hero p{
    font-size:25px;
    color:#ddd;
}

.hero p b{
    color:#ff00a8;
}

/* CATEGORIES */

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin:0 3%;
}

.category{
    min-height:145px;
    border-radius:22px;
    background:linear-gradient(145deg,#13131e,#090911);
    border:1px solid #343344;
    color:white;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:.2s;
}

.category:hover{
    transform:translateY(-3px);
    border-color:#ff00a8;
    box-shadow:0 0 20px rgba(255,0,168,.25);
}

.category.active{
    border:2px solid #ff00a8;
    background:linear-gradient(145deg,#31002e,#100010);
    box-shadow:0 0 25px rgba(255,0,168,.25);
}

.icon{
    font-size:48px;
    margin-bottom:10px;
}

.category strong{
    font-size:21px;
}

.category small{
    color:#aaa;
    font-size:15px;
    margin-top:7px;
}

/* SECTION */

.section{
    margin:32px 3% 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.section h2{
    font-size:30px;
}

.view{
    color:#ff00a8;
    font-size:19px;
    cursor:pointer;
}

/* STATIONS */

#stations{
    margin:0 3%;
}

.station{
    min-height:92px;
    margin-bottom:10px;
    padding:12px 18px;
    border-radius:20px;
    border:1px solid #292837;
    background:linear-gradient(100deg,#11111b,#0b0b13);
    display:flex;
    align-items:center;
    gap:18px;
}

.stationLogo{
    width:68px;
    height:68px;
    border-radius:17px;
    object-fit:cover;
    background:#210040;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    flex-shrink:0;
}

.stationInfo{
    flex:1;
    min-width:0;
}

.stationName{
    font-size:20px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.stationMeta{
    margin-top:7px;
    color:#999;
    font-size:15px;
}

.actions{
    display:flex;
    align-items:center;
    gap:20px;
}

.favorite{
    font-size:30px;
    color:#ff00a8;
    cursor:pointer;
}

.playBtn{
    width:56px;
    height:56px;
    border-radius:50%;
    border:none;
    background:#ff009f;
    color:white;
    font-size:23px;
    cursor:pointer;
    box-shadow:0 0 18px rgba(255,0,159,.35);
}

.playBtn.playing{
    background:#7b00ff;
}

/* LOADING */

.loading{
    text-align:center;
    padding:45px 10px;
    color:#aaa;
    font-size:18px;
}

.error{
    text-align:center;
    padding:30px;
    color:#ff80d0;
}

/* PLAYER */

.player{
    position:fixed;
    left:12px;
    right:12px;
    bottom:78px;
    min-height:82px;
    border:1px solid #ff00a8;
    border-radius:22px;
    background:rgba(15,7,24,.96);
    backdrop-filter:blur(18px);
    z-index:50;
    display:flex;
    align-items:center;
    padding:10px 16px;
    box-shadow:0 0 30px rgba(255,0,168,.18);
}

.playerLogo{
    width:58px;
    height:58px;
    border-radius:15px;
    background:#27004c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    flex-shrink:0;
}

.playerInfo{
    flex:1;
    margin-left:15px;
    overflow:hidden;
}

.playerName{
    font-size:18px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playerStatus{
    color:#aaa;
    margin-top:5px;
}

.mainPlay{
    width:58px;
    height:58px;
    border-radius:50%;
    border:none;
    background:#ff009f;
    color:#fff;
    font-size:24px;
    cursor:pointer;
}

/* BOTTOM */

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:78px;
    background:#0d0d16;
    border-top:1px solid #292838;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:60;
}

.nav{
    color:#888;
    text-align:center;
    font-size:14px;
    cursor:pointer;
}

.nav div{
    font-size:29px;
    margin-bottom:3px;
}

.nav.active{
    color:#ff00a8;
}

/* SEARCH */

.searchBox{
    display:none;
    margin:15px 3%;
}

.searchBox input{
    width:100%;
    padding:16px 20px;
    border-radius:16px;
    border:1px solid #ff00a8;
    outline:none;
    background:#11111a;
    color:white;
    font-size:17px;
}

@media(max-width:700px){

    .header{
        height:75px;
        padding:0 18px;
    }

    .logo{
        font-size:24px;
    }

    .logo span{
        font-size:30px;
    }

    .menu{
        display:none;
    }

    .search{
        width:50px;
        height:50px;
        font-size:26px;
    }

    .hero{
        min-height:300px;
        margin:18px 3%;
        padding:28px;
    }

    .hero h1{
        font-size:43px;
    }

    .hero p{
        font-size:20px;
        max-width:320px;
    }

    .hero:after{
        font-size:100px;
        right:2%;
        top:30px;
        opacity:.45;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .category{
        min-height:125px;
    }

    .icon{
        font-size:40px;
    }

    .category strong{
        font-size:18px;
    }

    .section h2{
        font-size:24px;
    }

    .station{
        padding:10px;
        gap:12px;
    }

    .stationLogo{
        width:58px;
        height:58px;
    }

    .stationName{
        font-size:17px;
    }

    .stationMeta{
        font-size:13px;
    }

    .favorite{
        display:none;
    }

    .playBtn{
        width:50px;
        height:50px;
    }

    .player{
        bottom:78px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="menu">☰</div>

    <div class="logo">
        Madhu Music World <span>♫</span>
    </div>

    <div class="search" onclick="toggleSearch()">⌕</div>

</header>

<!-- SEARCH -->

<div class="searchBox" id="searchBox">
    <input
        id="searchInput"
        type="text"
        placeholder="স্টেশনের নাম খুঁজুন..."
        oninput="searchStations()">
</div>

<!-- HERO -->

<section class="hero">

    <div class="heroText">

        <h1>Feel The Music</h1>

        <p>
            Live Radio <b>•</b>
            Bengali <b>•</b>
            Retro <b>•</b>
            Evergreen
        </p>

    </div>

</section>

<!-- CATEGORIES -->

<section class="categories">

    <button class="category active"
            onclick="loadCategory('all',this)">
        <div class="icon">📻</div>
        <strong>All Stations</strong>
        <small>Live Radio</small>
    </button>

    <button class="category"
            onclick="loadCategory('bengali',this)">
        <div class="icon">🎵</div>
        <strong>বাংলা</strong>
        <small>Bangla Radio</small>
    </button>

    <button class="category"
            onclick="loadCategory('oldbengali',this)">
        <div class="icon">🕰️</div>
        <strong>পুরোনো বাংলা</strong>
        <small>70s • 80s • 90s</small>
    </button>

    <button class="category"
            onclick="loadCategory('hindi',this)">
        <div class="icon">🎶</div>
        <strong>Hindi Oldies</strong>
        <small>Retro Hits</small>
    </button>

    <button class="category"
            onclick="loadCategory('english',this)">
        <div class="icon">🎸</div>
        <strong>English Retro</strong>
        <small>Classic Hits</small>
    </button>

    <button class="category"
            onclick="loadCategory('rabindra',this)">
        <div class="icon">🎼</div>
        <strong>রবীন্দ্রসঙ্গীত</strong>
        <small>Rabindra Sangeet</small>
    </button>

    <button class="category"
            onclick="loadCategory('bhajan',this)">
        <div class="icon">🕉️</div>
        <strong>Bhajan</strong>
        <small>Devotional</small>
    </button>

    <button class="category"
            onclick="showFavorites()">
        <div class="icon">💜</div>
        <strong>My Favorite</strong>
        <small>Saved Stations</small>
    </button>

</section>

<!-- TITLE -->

<section class="section">

    <h2>Popular Stations</h2>

    <div class="view"
         onclick="loadCategory('all')">
        View All ›
    </div>

</section>

<!-- STATIONS -->

<div id="stations">

    <div class="loading">
        🎧 স্টেশন খোঁজা হচ্ছে...
    </div>

</div>

<!-- PLAYER -->

<div class="player">

    <div class="playerLogo" id="playerLogo">
        🎧
    </div>

    <div class="playerInfo">

        <div class="playerName" id="playerName">
            কোনো স্টেশন চলছে না
        </div>

        <div class="playerStatus" id="playerStatus">
            একটি Radio Station নির্বাচন করুন
        </div>

    </div>

    <button class="mainPlay"
            id="mainPlay"
            onclick="togglePlayer()">
        ▶
    </button>

</div>

<!-- BOTTOM NAV -->

<nav class="bottom">

    <div class="nav active">
        <div>⌂</div>
        Home
    </div>

    <div class="nav"
         onclick="loadCategory('all')">
        <div>♫</div>
        Music
    </div>

    <div class="nav"
         onclick="showFavorites()">
        <div>♥</div>
        Favorite
    </div>

    <div class="nav"
         onclick="loadCategory('oldbengali')">
        <div>▱</div>
        Library
    </div>

</nav>

<audio id="audio"
       preload="none"
       playsinline></audio>

<script>

/* =========================================
   MADHU MUSIC WORLD
   RADIO BROWSER API
========================================= */

const SERVERS = [
    "https://de1.api.radio-browser.info",
    "https://nl1.api.radio-browser.info",
    "https://at1.api.radio-browser.info"
];

let stations = [];
let currentStation = null;
let favorites =
    JSON.parse(localStorage.getItem("madhuFavorites") || "[]");

const audio = document.getElementById("audio");

let currentCategory = "all";


/* =========================================
   API REQUEST
========================================= */

async function apiRequest(path){

    for(const server of SERVERS){

        try{

            const response = await fetch(
                server + path,
                {
                    headers:{
                        "Accept":"application/json"
                    }
                }
            );

            if(response.ok){

                const data = await response.json();

                if(Array.isArray(data)){
                    return data;
                }

            }

        }catch(error){

            console.log(
                "Server failed:",
                server
            );

        }

    }

    return [];

}


/* =========================================
   BASE QUERY
========================================= */

function makeQuery(extra=""){

    return `/json/stations/search?${extra}` +
           `&hidebroken=true` +
           `&order=clickcount` +
           `&reverse=true` +
           `&limit=30`;

}


/* =========================================
   LOAD CATEGORY
========================================= */

async function loadCategory(category,button=null){

    currentCategory = category;

    if(button){

        document
        .querySelectorAll(".category")
        .forEach(x=>x.classList.remove("active"));

        button.classList.add("active");

    }

    document.getElementById("stations").innerHTML =
        `<div class="loading">
            🎧 ${getCategoryName(category)}
            স্টেশন খোঁজা হচ্ছে...
         </div>`;

    let data = [];

    if(category === "all"){

        data = await apiRequest(
            makeQuery(
                "country=India&is_https=true"
            )
        );

        /* India না পেলে global */
        if(data.length < 5){

            data = await apiRequest(
                makeQuery(
                    "language=bengali"
                )
            );

        }

    }

    else if(category === "bengali"){

        data = await apiRequest(
            makeQuery(
                "language=bengali"
            )
        );

        if(data.length < 5){

            data = await apiRequest(
                makeQuery(
                    "tag=bangla"
                )
            );

        }

    }

    else if(category === "oldbengali"){

        data = await apiRequest(
            makeQuery(
                "language=bengali&tag=oldies"
            )
        );

        if(data.length < 5){

            data = await apiRequest(
                makeQuery(
                    "language=bengali&tag=retro"
                )
            );

        }

    }

    else if(category === "hindi"){

        data = await apiRequest(
            makeQuery(
                "language=hindi&tag=oldies"
            )
        );

        if(data.length < 5){

            data = await apiRequest(
                makeQuery(
                    "language=hindi"
                )
            );

        }

    }

    else if(category === "english"){

        data = await apiRequest(
            makeQuery(
                "language=english&tag=oldies"
            )
        );

        if(data.length < 5){

            data = await apiRequest(
                makeQuery(
                    "language=english&tag=retro"
                )
            );

        }

    }

    else if(category === "rabindra"){

        data = await apiRequest(
            makeQuery(
                "tag=rabindra"
            )
        );

        if(data.length < 5){

            data = await apiRequest(
                makeQuery(
                    "name=Rabindra"
                )
            );

        }

    }

    else if(category === "bhajan"){

        data = await apiRequest(
            makeQuery(
                "tag=bhajan"
            )
        );

        if(data.length < 5){

            data = await apiRequest(
                makeQuery(
                    "tag=devotional"
                )
            );

        }

    }

    stations = cleanStations(data);

    renderStations(stations);

}


/* =========================================
   CLEAN STATIONS
========================================= */

function cleanStations(data){

    const seen = new Set();

    return data.filter(station=>{

        const url =
            station.url_resolved ||
            station.url;

        if(!url) return false;

        if(!/^https?:\/\//i.test(url))
            return false;

        if(seen.has(station.stationuuid))
            return false;

        seen.add(station.stationuuid);

        return true;

    }).slice(0,30);

}


/* =========================================
   RENDER
========================================= */

function renderStations(list){

    const box =
        document.getElementById("stations");

    if(!list.length){

        box.innerHTML = `
            <div class="error">
                😔 এই বিভাগে এখন কোনো স্টেশন পাওয়া যাচ্ছে না।
                <br><br>
                অন্য একটি বিভাগ চেষ্টা করুন।
            </div>
        `;

        return;
    }

    box.innerHTML = "";

    list.forEach(station=>{

        const div =
            document.createElement("div");

        div.className = "station";

        const isFav =
            favorites.includes(
                station.stationuuid
            );

        div.innerHTML = `

            <div class="stationLogo">

                ${
                    station.favicon
                    ?
                    `<img
                       src="${escapeHTML(station.favicon)}"
                       style="
                       width:100%;
                       height:100%;
                       object-fit:cover;
                       border-radius:17px;"
                       onerror="this.style.display='none'"
                    >`
                    :
                    `🎧`
                }

            </div>

            <div class="stationInfo">

                <div class="stationName">
                    ${escapeHTML(station.name || "Radio Station")}
                </div>

                <div class="stationMeta">
                    ${escapeHTML(
                        station.language ||
                        station.tags ||
                        "Radio"
                    )}
                    ${station.country ? " • " + escapeHTML(station.country) : ""}
                </div>

            </div>

            <div class="actions">

                <div
                    class="favorite"
                    onclick="toggleFavorite('${station.stationuuid}')">

                    ${isFav ? "♥" : "♡"}

                </div>

                <button
                    class="playBtn"
                    onclick='playStation(${JSON.stringify(station)})'>

                    ▶

                </button>

            </div>
        `;

        box.appendChild(div);

    });

}


/* =========================================
   PLAY STATION
========================================= */

async function playStation(station){

    const url =
        station.url_resolved ||
        station.url;

    if(!url){

        alert("এই স্টেশনের stream পাওয়া যাচ্ছে না।");

        return;
    }

    try{

        if(currentStation &&
           currentStation.stationuuid === station.stationuuid &&
           !audio.paused){

            audio.pause();

            document.getElementById("mainPlay")
                .textContent = "▶";

            return;
        }

        currentStation = station;

        audio.src = url;

        audio.load();

        await audio.play();

        document.getElementById("playerName")
            .textContent =
            station.name || "Radio Station";

        document.getElementById("playerStatus")
            .textContent =
            "● Live Radio চলছে";

        document.getElementById("mainPlay")
            .textContent = "Ⅱ";

    }catch(error){

        console.log(error);

        document.getElementById("playerName")
            .textContent =
            station.name || "Radio Station";

        document.getElementById("playerStatus")
            .textContent =
            "এই স্টেশনটি এখন চালু করা যাচ্ছে না";

        document.getElementById("mainPlay")
            .textContent = "▶";

    }

}


/* =========================================
   PLAYER
========================================= */

function togglePlayer(){

    if(!currentStation){

        alert(
            "আগে একটি Radio Station নির্বাচন করুন।"
        );

        return;
    }

    if(audio.paused){

        audio.play()
        .then(()=>{

            document.getElementById("mainPlay")
                .textContent = "Ⅱ";

        })
        .catch(()=>{

            document.getElementById("playerStatus")
                .textContent =
                "স্টেশনটি চালু করা যাচ্ছে না";

        });

    }else{

        audio.pause();

        document.getElementById("mainPlay")
            .textContent = "▶";

    }

}


/* =========================================
   FAVORITE
========================================= */

function toggleFavorite(id){

    if(favorites.includes(id)){

        favorites =
            favorites.filter(x=>x!==id);

    }else{

        favorites.push(id);

    }

    localStorage.setItem(
        "madhuFavorites",
        JSON.stringify(favorites)
    );

    renderStations(stations);

}


/* =========================================
   SHOW FAVORITES
========================================= */

async function showFavorites(){

    if(!favorites.length){

        document.getElementById("stations").innerHTML = `
            <div class="error">
                💜 এখনও কোনো Favorite Station নেই।
            </div>
        `;

        return;
    }

    document.getElementById("stations").innerHTML =
        `<div class="loading">
            💜 Favorite Station খোঁজা হচ্ছে...
        </div>`;

    let all = [];

    for(const id of favorites){

        const data =
            await apiRequest(
                `/json/stations/byuuid/${id}`
            );

        all.push(...data);

    }

    stations = cleanStations(all);

    renderStations(stations);

}


/* =========================================
   SEARCH
========================================= */

function toggleSearch(){

    const box =
        document.getElementById("searchBox");

    box.style.display =
        box.style.display === "block"
        ? "none"
        : "block";

    if(box.style.display === "block"){

        document
        .getElementById("searchInput")
        .focus();

    }

}


let searchTimer;

function searchStations(){

    clearTimeout(searchTimer);

    const value =
        document
        .getElementById("searchInput")
        .value
        .trim();

    if(!value){

        loadCategory(currentCategory);

        return;

    }

    searchTimer =
        setTimeout(async()=>{

            document.getElementById("stations")
            .innerHTML =
                `<div class="loading">
                    🔎 খোঁজা হচ্ছে...
                 </div>`;

            const data =
                await apiRequest(
                    makeQuery(
                        "name=" +
                        encodeURIComponent(value)
                    )
                );

            stations =
                cleanStations(data);

            renderStations(stations);

        },400);

}

/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
