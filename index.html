<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Madhu Music World 🎵</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#050509;
    color:#fff;
    min-height:100vh;
    padding-bottom:170px;
}

button{
    font-family:inherit;
}

.hidden{
    display:none !important;
}


/* =========================
   HEADER
========================= */

header{
    height:105px;
    padding:25px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#09090f;

    border-bottom:1px solid #282833;

    position:sticky;
    top:0;
    z-index:500;
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.searchButton{
    width:55px;
    height:55px;

    border-radius:50%;

    border:1px solid #292937;

    background:#15151f;

    color:#fff;

    font-size:27px;

    cursor:pointer;
}


/* =========================
   SEARCH
========================= */

.searchArea{
    display:none;

    padding:15px 20px;

    background:#0b0b12;

    border-bottom:1px solid #272733;
}

.searchArea input{

    width:100%;

    height:50px;

    padding:0 20px;

    border-radius:30px;

    border:1px solid #3a3a48;

    background:#171720;

    color:#fff;

    font-size:17px;

    outline:none;
}

.searchArea input:focus{
    border-color:#ff009d;
}


/* =========================
   MAIN
========================= */

.container{

    max-width:900px;

    margin:auto;

    padding:20px 20px 190px;
}


/* =========================
   HERO
========================= */

.hero{

    height:430px;

    border-radius:35px;

    margin-bottom:30px;

    padding:40px;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    overflow:hidden;

    background:
    radial-gradient(
        circle at 78% 30%,
        #ff00a8 0%,
        #8500a0 18%,
        transparent 45%
    ),
    linear-gradient(
        135deg,
        #26004c,
        #090014
    );

    box-shadow:
    0 0 50px rgba(255,0,180,.15);
}

.heroIcon{
    position:absolute;
    opacity:.18;
    font-size:180px;
    right:35px;
    top:80px;
}

.hero h2{
    font-size:53px;
    margin-bottom:12px;
}

.hero p{
    color:#ddd;
    font-size:23px;
}


/* =========================
   CATEGORY
========================= */

.categories{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;

    margin-bottom:30px;
}

.category{

    min-height:95px;

    border-radius:28px;

    border:1px solid #2c2c3a;

    background:#12121d;

    color:white;

    font-size:20px;

    padding:15px;

    cursor:pointer;

    transition:.2s;
}

.category:active{
    transform:scale(.96);
}

.category.active{

    background:
    linear-gradient(
        135deg,
        #ff009d,
        #d000ff
    );

    border-color:#ff009d;

    box-shadow:
    0 0 25px rgba(255,0,160,.25);
}


/* =========================
   SECTION TITLE
========================= */

.sectionTitle{

    font-size:30px;

    margin:25px 5px;
}

.sectionSubTitle{

    color:#999;

    margin:-18px 5px 25px;

    font-size:16px;
}


/* =========================
   LOADING
========================= */

.loading{

    text-align:center;

    padding:70px 20px;

    color:#aaa;

    font-size:20px;
}

.error{

    text-align:center;

    padding:60px 20px;

    color:#aaa;

    font-size:18px;
}


/* =========================
   STATION
========================= */

.station{

    display:flex;

    align-items:center;

    gap:15px;

    padding:16px;

    margin-bottom:15px;

    background:#12121d;

    border:1px solid #292938;

    border-radius:27px;

    min-height:110px;
}

.stationLogo{

    width:82px;

    height:82px;

    border-radius:20px;

    object-fit:cover;

    background:#250045;

    flex-shrink:0;
}

.stationInfo{

    flex:1;

    min-width:0;
}

.stationName{

    font-size:20px;

    font-weight:bold;

    margin-bottom:7px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.stationMeta{

    color:#999;

    font-size:14px;

    line-height:1.4;
}

.stationButtons{

    display:flex;

    align-items:center;

    gap:7px;
}

.playButton{

    width:60px;

    height:60px;

    border:0;

    border-radius:50%;

    background:#ff009d;

    color:#fff;

    font-size:24px;

    cursor:pointer;

    flex-shrink:0;
}

.playButton:active{
    transform:scale(.92);
}

.favoriteButton{

    width:42px;

    height:42px;

    border:0;

    background:transparent;

    color:#777;

    font-size:28px;

    cursor:pointer;
}

.favoriteButton.active{
    color:#ff1493;
}


/* =========================
   NO RESULT
========================= */

.noResult{

    text-align:center;

    padding:60px 15px;

    color:#888;

    font-size:19px;

    line-height:1.7;
}


/* =========================
   BOTTOM PLAYER
========================= */

.player{

    position:fixed;

    left:0;

    right:0;

    bottom:80px;

    height:80px;

    background:#11111b;

    border-top:1px solid #30303c;

    display:none;

    align-items:center;

    gap:12px;

    padding:10px 15px;

    z-index:900;
}

.playerLogo{

    width:58px;

    height:58px;

    border-radius:16px;

    object-fit:cover;

    background:#250045;
}

.playerInfo{

    flex:1;

    min-width:0;
}

.playerName{

    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.playerCountry{

    font-size:13px;

    color:#999;

    margin-top:4px;
}

.playerControls{

    display:flex;

    align-items:center;

    gap:5px;
}

.controlButton{

    width:38px;

    height:45px;

    border:0;

    background:transparent;

    color:#fff;

    font-size:22px;

    cursor:pointer;
}

.mainPlay{

    width:50px;

    height:50px;

    border:0;

    border-radius:50%;

    background:#ff009d;

    color:#fff;

    font-size:20px;

    cursor:pointer;
}


/* =========================
   BOTTOM NAVIGATION
========================= */

.bottomNav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:80px;

    background:#11111b;

    border-top:1px solid #30303c;

    display:flex;

    justify-content:space-around;

    align-items:center;

    z-index:1000;
}

.navButton{

    width:25%;

    height:75px;

    border:0;

    background:transparent;

    color:#888;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    cursor:pointer;
}

.navIcon{

    font-size:27px;

    line-height:30px;
}

.navText{

    font-size:14px;
}

.navButton.active{

    color:#ff009d;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        height:90px;
        padding:20px 18px;
    }

    .logo{
        font-size:25px;
    }

    .searchButton{
        width:50px;
        height:50px;
    }

    .container{
        padding-left:15px;
        padding-right:15px;
    }

    .hero{
        height:400px;
        padding:30px;
        border-radius:30px;
    }

    .hero h2{
        font-size:42px;
    }

    .hero p{
        font-size:19px;
    }

    .categories{
        gap:10px;
    }

    .category{
        min-height:88px;
        font-size:18px;
        padding:10px;
        border-radius:23px;
    }

    .station{
        padding:13px;
        gap:10px;
    }

    .stationLogo{
        width:70px;
        height:70px;
        border-radius:17px;
    }

    .stationName{
        font-size:17px;
    }

    .stationMeta{
        font-size:12px;
    }

    .playButton{
        width:53px;
        height:53px;
        font-size:21px;
    }

    .favoriteButton{
        width:35px;
        font-size:24px;
    }

    .player{
        bottom:80px;
    }
}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        Madhu Music World 🎵
    </div>

    <button
        class="searchButton"
        onclick="toggleSearch()">
        🔎
    </button>

</header>


<!-- SEARCH -->

<div
    class="searchArea"
    id="searchArea">

    <input
        id="searchInput"
        type="text"
        placeholder="স্টেশনের নাম লিখে খুঁজুন..."
        oninput="searchStation()">

</div>


<!-- =========================
     MAIN
========================= -->

<main class="container">


<!-- HERO -->

<section class="hero">

    <div class="heroIcon">
        🎧
    </div>

    <h2>
        Feel The Music
    </h2>

    <p>
        Live Radio • Bengali • Retro • Evergreen
    </p>

</section>


<!-- =========================
     CATEGORIES
========================= -->

<section class="categories">

    <button
        class="category active"
        onclick="selectCategory('all',this)">
        🎵 All Stations
    </button>


    <button
        class="category"
        onclick="selectCategory('bengali',this)">
        🎶 Bengali
    </button>


    <button
        class="category"
        onclick="selectCategory('old',this)">
        🕰️ 70s • 80s • 90s
    </button>


    <button
        class="category"
        onclick="selectCategory('hindi',this)">
        🎵 Hindi
    </button>


    <button
        class="category"
        onclick="selectCategory('rabindra',this)">
        🎼 Rabindra Sangeet
    </button>


    <button
        class="category"
        onclick="selectCategory('bhajan',this)">
        🕉️ Bhajan
    </button>

</section>


<!-- TITLE -->

<h2
    class="sectionTitle"
    id="sectionTitle">
    All Stations
</h2>

<p
    class="sectionSubTitle"
    id="sectionSubTitle">
    Popular online radio stations
</p>


<!-- STATIONS -->

<div id="stationList">

    <div class="loading">
        🎵 স্টেশন খোঁজা হচ্ছে...
    </div>

</div>


</main>


<!-- =========================
     PLAYER
========================= -->

<div
    class="player"
    id="player">

    <img
        class="playerLogo"
        id="playerLogo"
        src=""
        alt="">

    <div class="playerInfo">

        <div
            class="playerName"
            id="playerName">
            No station
        </div>

        <div
            class="playerCountry"
            id="playerCountry">
            Ready
        </div>

    </div>


    <div class="playerControls">

        <button
            class="controlButton"
            onclick="previousStation()">
            ⏮
        </button>

        <button
            class="mainPlay"
            id="mainPlay"
            onclick="togglePlayer()">
            ▶
        </button>

        <button
            class="controlButton"
            onclick="nextStation()">
            ⏭
        </button>

    </div>

</div>


<!-- AUDIO -->

<audio id="audio"></audio>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottomNav">

    <button
        class="navButton active"
        onclick="goHome(this)">

        <span class="navIcon">
            🏠
        </span>

        <span class="navText">
            Home
        </span>

    </button>


    <button
        class="navButton"
        onclick="musicPage(this)">

        <span class="navIcon">
            🎵
        </span>

        <span class="navText">
            Music
        </span>

    </button>


    <button
        class="navButton"
        onclick="favoritePage(this)">

        <span class="navIcon">
            ❤️
        </span>

        <span class="navText">
            Favorite
        </span>

    </button>


    <button
        class="navButton"
        onclick="libraryPage(this)">

        <span class="navIcon">
            📚
        </span>

        <span class="navText">
            Library
        </span>

    </button>

</nav>


<script>


/* =====================================================
   RADIO BROWSER
===================================================== */

const API =
"https://de1.api.radio-browser.info/json/stations/search";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let stations = [];

let visibleStations = [];

let currentIndex = -1;

let currentCategory = "all";

let favorites =
JSON.parse(
    localStorage.getItem("madhuMusicFavorites") || "[]"
);

const audio =
document.getElementById("audio");


/* =====================================================
   TITLES
===================================================== */

const categoryTitles = {

    all:
    "All Stations",

    bengali:
    "Bengali Radio",

    old:
    "🕰️ 70s • 80s • 90s Old Songs",

    hindi:
    "Hindi Radio",

    rabindra:
    "Rabindra Sangeet",

    bhajan:
    "Bhajan"

};


/* =====================================================
   CATEGORY DESCRIPTION
===================================================== */

const categoryDescriptions = {

    all:
    "Popular online radio stations",

    bengali:
    "বাংলা ভাষার অনলাইন রেডিও",

    old:
    "পুরোনো বাংলা • Retro • Evergreen • Oldies",

    hindi:
    "হিন্দি গান ও রেডিও",

    rabindra:
    "রবীন্দ্রসঙ্গীতের স্টেশন",

    bhajan:
    "ভক্তিমূলক গান ও Bhajan"

};


/* =====================================================
   LOAD CATEGORY
===================================================== */

async function selectCategory(category,button){

    currentCategory =
    category;

    document
    .querySelectorAll(".category")
    .forEach(x=>{
        x.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }


    document
    .getElementById("sectionTitle")
    .innerText =
    categoryTitles[category];


    document
    .getElementById("sectionSubTitle")
    .innerText =
    categoryDescriptions[category];


    document
    .getElementById("stationList")
    .innerHTML =
    `
    <div class="loading">
        🎵 স্টেশন খোঁজা হচ্ছে...
    </div>
    `;


    try{

        let data = [];


        /* =========================
           ALL
        ========================= */

        if(category === "all"){

            data =
            await getStations(
                {
                    limit:80,
                    order:"clickcount",
                    reverse:true
                }
            );

        }


        /* =========================
           BENGALI
        ========================= */

        else if(category === "bengali"){

            data =
            await getStations(
                {
                    language:"bengali",
                    limit:80,
                    order:"clickcount",
                    reverse:true
                }
            );

        }


        /* =========================
           HINDI
        ========================= */

        else if(category === "hindi"){

            data =
            await getStations(
                {
                    language:"hindi",
                    limit:80,
                    order:"clickcount",
                    reverse:true
                }
            );

        }


        /* =========================
           RABINDRA
        ========================= */

        else if(category === "rabindra"){

            let a =
            await getStations(
                {
                    language:"bengali",
                    tag:"rabindra",
                    limit:40,
                    order:"clickcount",
                    reverse:true
                }
            );

            let b =
            await getStations(
                {
                    name:"Rabindra",
                    limit:40,
                    order:"clickcount",
                    reverse:true
                }
            );

            data =
            mergeStations(a,b);

        }


        /* =========================
           BHAJAN
        ========================= */

        else if(category === "bhajan"){

            let a =
            await getStations(
                {
                    tag:"bhajan",
                    limit:50,
                    order:"clickcount",
                    reverse:true
                }
            );

            let b =
            await getStations(
                {
                    tag:"devotional",
                    limit:50,
                    order:"clickcount",
                    reverse:true
                }
            );

            data =
            mergeStations(a,b);

        }


        /* =========================
           OLD BENGALI
        ========================= */

        else if(category === "old"){

            /*
              একসঙ্গে কয়েকটি tag/name search
              করা হচ্ছে যাতে পুরোনো
              বাংলা স্টেশন বেশি পাওয়া যায়।
            */

            let results = [];


            let oldies =
            await getStations(
                {
                    language:"bengali",
                    tag:"oldies",
                    limit:50,
                    order:"clickcount",
                    reverse:true
                }
            );


            let retro =
            await getStations(
                {
                    language:"bengali",
                    tag:"retro",
                    limit:50,
                    order:"clickcount",
                    reverse:true
                }
            );


            let classics =
            await getStations(
                {
                    language:"bengali",
                    tag:"classic",
                    limit:50,
                    order:"clickcount",
                    reverse:true
                }
            );


            let yesteryears =
            await getStations(
                {
                    name:"Yesteryears",
                    limit:30,
                    order:"clickcount",
                    reverse:true
                }
            );


            let vintage =
            await getStations(
                {
                    language:"bengali",
                    tag:"vintage",
                    limit:50,
                    order:"clickcount",
                    reverse:true
                }
            );


            results =
            mergeStations(
                oldies,
                retro,
                classics,
                yesteryears,
                vintage
            );


            /*
              Bengali station হলে আগে দেখাবে।
            */

            data =
            results.filter(
                x =>
                String(x.language || "")
                .toLowerCase()
                .includes("bengali")
            );

        }


        stations =
        cleanStations(data);


        visibleStations =
        [...stations];


        renderStations(
            visibleStations
        );


    }catch(error){

        console.error(error);

        document
        .getElementById("stationList")
        .innerHTML =
        `
        <div class="error">

            ❌ স্টেশন লোড করা যাচ্ছে না।

            <br><br>

            ইন্টারনেট connection
            অথবা radio server সমস্যা হতে পারে।

            <br><br>

            একটু পরে আবার চেষ্টা করুন।

        </div>
        `;

    }

}


/* =====================================================
   GET STATIONS
===================================================== */

async function getStations(params){

    const query =
    new URLSearchParams();

    query.set(
        "hidebroken",
        "true"
    );


    Object.keys(params)
    .forEach(key=>{

        if(
            params[key] !== undefined &&
            params[key] !== null &&
            params[key] !== ""
        ){

            query.set(
                key,
                params[key]
            );

        }

    });


    const response =
    await fetch(
        API + "?" + query.toString()
    );


    if(!response.ok){
        throw new Error(
            "Radio Browser error"
        );
    }


    return await response.json();

}


/* =====================================================
   MERGE
===================================================== */

function mergeStations(...arrays){

    const map =
    new Map();


    arrays
    .flat()
    .forEach(station=>{

        if(
            station &&
            station.stationuuid
        ){

            map.set(
                station.stationuuid,
                station
            );

        }

    });


    return Array.from(
        map.values()
    );

}


/* =====================================================
   CLEAN
===================================================== */

function cleanStations(data){

    return data
    .filter(
        station =>
        station &&
        station.stationuuid &&
        station.name &&
        station.url_resolved
    )
    .filter(
        station =>
        !isExcludedStation(station)
    );

}


/* =====================================================
   EXCLUDED
===================================================== */

function isExcludedStation(station){

    const text =
    (
        (station.name || "") +
        " " +
        (station.tags || "")
    )
    .toLowerCase();


    /*
       এগুলো Madhu Music World-এ
       রাখা হবে না।
    */

    const blocked = [

        "art of living",

        "artofliving",

        "ramakrishna",

        "ram krishna",

        "ramkrishna"

    ];


    return blocked.some(
        word =>
        text.includes(word)
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderStations(list){

    const box =
    document.getElementById(
        "stationList"
    );


    if(!list.length){

        box.innerHTML =
        `
        <div class="noResult">

            😔 কোনো অনলাইন স্টেশন পাওয়া যায়নি।

            <br><br>

            অন্য category চেষ্টা করুন।

        </div>
        `;

        return;

    }


    box.innerHTML = "";


    list.forEach(
        (station,index)=>{

            const logo =
            station.favicon ||
            "https://cdn-icons-png.flaticon.com/512/727/727245.png";


            const favorite =
            favorites.includes(
                station.stationuuid
            );


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "station";


            div.innerHTML =
            `

            <img
                class="stationLogo"
                src="${escapeHTML(logo)}"
                onerror="
                    this.src='https://cdn-icons-png.flaticon.com/512/727/727245.png'
                "
            >


            <div class="stationInfo">

                <div class="stationName">

                    ${escapeHTML(
                        station.name
                    )}

                </div>


                <div class="stationMeta">

                    ${
                        escapeHTML(
                            station.language ||
                            "Music"
                        )
                    }

                    ${
                        station.countrycode
                        ?
                        " • " +
                        escapeHTML(
                            station.countrycode
                        )
                        :
                        ""
                    }

                    ${
                        station.bitrate
                        ?
                        " • " +
                        station.bitrate +
                        " kbps"
                        :
                        ""
                    }

                </div>

            </div>


            <div class="stationButtons">

                <button
                    class="favoriteButton ${
                        favorite
                        ? "active"
                        : ""
                    }"
                    onclick="
                        toggleFavorite(
                            event,
                            '${station.stationuuid}'
                        )
                    "
                >
                    ${
                        favorite
                        ? "♥"
                        : "♡"
                    }
                </button>


                <button
                    class="playButton"
                    onclick="
                        playStation(${index})
                    "
                >
                    ▶
                </button>

            </div>

            `;


            box.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   PLAY
===================================================== */

function playStation(index){

    if(!visibleStations[index]){
        return;
    }


    currentIndex =
    index;


    const station =
    visibleStations[index];


    audio.src =
    station.url_resolved;


    audio.play()
    .then(()=>{

        showPlayer(
            station
        );

    })
    .catch(()=>{

        alert(
            "এই স্টেশনটি এখন চালু নেই। " +
            "⏭ চাপুন এবং অন্য স্টেশন চেষ্টা করুন।"
        );

    });

}


/* =====================================================
   PLAYER
===================================================== */

function showPlayer(station){

    document
    .getElementById("player")
    .style.display =
    "flex";


    document
    .getElementById("playerName")
    .innerText =
    station.name;


    document
    .getElementById("playerCountry")
    .innerText =
    (
        station.language ||
        "Music"
    )
    +
    (
        station.countrycode
        ?
        " • " +
        station.countrycode
        :
        ""
    );


    document
    .getElementById("playerLogo")
    .src =
    station.favicon ||
    "https://cdn-icons-png.flaticon.com/512/727/727245.png";


    document
    .getElementById("mainPlay")
    .innerText =
    "⏸";

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlayer(){

    if(!audio.src){

        if(
            visibleStations.length
        ){

            playStation(0);

        }

        return;

    }


    if(audio.paused){

        audio.play();

    }else{

        audio.pause();

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextStation(){

    if(!visibleStations.length){
        return;
    }


    currentIndex =
    (
        currentIndex + 1
    )
    %
    visibleStations.length;


    playStation(
        currentIndex
    );

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousStation(){

    if(!visibleStations.length){
        return;
    }


    currentIndex =
    (
        currentIndex -
        1 +
        visibleStations.length
    )
    %
    visibleStations.length;


    playStation(
        currentIndex
    );

}


/* =====================================================
   AUDIO EVENTS
===================================================== */

audio.addEventListener(
    "play",
    ()=>{
        document
        .getElementById(
            "mainPlay"
        )
        .innerText =
        "⏸";
    }
);


audio.addEventListener(
    "pause",
    ()=>{
        document
        .getElementById(
            "mainPlay"
        )
        .innerText =
        "▶";
    }
);


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(
    event,
    id
){

    event.stopPropagation();


    if(
        favorites.includes(id)
    ){

        favorites =
        favorites.filter(
            x => x !== id
        );

    }else{

        favorites.push(id);

    }


    localStorage.setItem(
        "madhuMusicFavorites",
        JSON.stringify(
            favorites
        )
    );


    renderStations(
        visibleStations
    );

}


/* =====================================================
   FAVORITE PAGE
===================================================== */

function favoritePage(button){

    setNavActive(
        button
    );


    document
    .getElementById(
        "sectionTitle"
    )
    .innerText =
    "❤️ Favorite Stations";


    document
    .getElementById(
        "sectionSubTitle"
    )
    .innerText =
    "তোমার পছন্দের স্টেশন";


    const fav =
    stations.filter(
        x =>
        favorites.includes(
            x.stationuuid
        )
    );


    visibleStations =
    fav;


    renderStations(
        fav
    );

}

/* =====================================================
   NAV ACTIVE
===================================================== */

function setNavActive(button){

    document
    .querySelectorAll(
        ".navButton"
    )
    .forEach(
        x =>
        x.classList.remove(
            "active"
        )
    );


    button.classList.add(
        "active"
    );

}


/* =====================================================
   SEARCH OPEN/CLOSE
===================================================== */

function toggleSearch(){

    const area =
    document.getElementById(
        "searchArea"
    );


    if(
        area.style.display ===
        "block"
    ){

        area.style.display =
        "none";

    }else{

        area.style.display =
        "block";

        document
        .getElementById(
            "searchInput"
        )
        .focus();

    }

}


/* =====================================================
   SEARCH
===================================================== */

function searchStation(){

    const query =
    document
    .getElementById(
        "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


    if(!query){

        visibleStations =
        [...stations];

        renderStations(
            visibleStations
        );

        return;

    }


    visibleStations =
    stations.filter(
        station => {

            const text =
            (
                station.name +
                " " +
                (
                    station.language ||
                    ""
                ) +
                " " +
                (
                    station.tags ||
                    ""
                ) +
                " " +
                (
                    station.countrycode ||
                    ""
                )
            )
            .toLowerCase();


            return text.includes(
                query
            );

        }
    );


    renderStations(
        visibleStations
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    if(!text){
        return "";
    }


    return String(text)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

selectCategory(

    document.querySelector(
        ".category"
    )
);
