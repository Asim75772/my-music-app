<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wave Music V2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#09090d;
color:white;
}

.app{
max-width:500px;
margin:auto;
padding:20px;
padding-bottom:80px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
font-size:30px;
}

.card{
background:#171720;
border-radius:30px;
padding:20px;
margin-top:25px;
text-align:center;
}

.cover{
height:300px;
border-radius:25px;
background:linear-gradient(135deg,#444,#111);
display:flex;
align-items:center;
justify-content:center;
font-size:100px;
}

.title{
font-size:26px;
font-weight:bold;
margin-top:20px;
}

.artist{
color:#999;
margin-top:8px;
}

input{
width:100%;
margin-top:20px;
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:25px;
margin-top:25px;
}

button{
border:0;
background:none;
color:white;
font-size:30px;
}

.play{
background:white;
color:black;
height:70px;
width:70px;
border-radius:50%;
}

.list{
margin-top:30px;
}

.song{
display:flex;
align-items:center;
background:#171720;
padding:15px;
border-radius:20px;
margin-top:15px;
}

.pic{
height:55px;
width:55px;
background:#292933;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
margin-right:15px;
}

.info{
flex:1;
}

.info p{
color:#888;
}

.like{
font-size:22px;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#15151b;
display:flex;
justify-content:space-around;
padding:15px;
font-size:15px;
}

</style>

</head>

<body>

<div class="app">

<div class="header">
<h1>Wave Music 🎵</h1>
<span>🔍</span>
</div>

<div class="card">

<div class="cover">
🎧
</div>

<div class="title" id="title">
Select Song
</div>

<div class="artist" id="artist">
Artist
</div>

<input type="range" id="progress">

<div class="controls">

<button onclick="previous()">⏮</button>

<button class="play" onclick="playPause()" id="play">
▶
</button>

<button onclick="next()">⏭</button>

</div>

</div>

<div class="list">

<h2>Songs</h2>

<div id="songs"></div>

</div>

</div>
<div class="nav">
<div>🏠<br>Home</div>
<div>🎵<br>Music</div>
<div>❤️<br>Favorite</div>
<div>📂<br>Library</div>
</div>

<audio id="audio"></audio>


<script>

const songs=[
{
title:"Online Music 1",
artist:"Soma FM",
url:"https://ice5.somafm.com/live-128-mp3"
},
{
title:"Online Music 2",
artist:"Groove Salad",
url:"https://ice1.somafm.com/groovesalad-128-mp3"
},
{
title:"Online Music 3",
artist:"Drone Zone",
url:"https://ice2.somafm.com/dronezone-128-mp3"
}
];


let current=0;
let playing=false;


const audio=document.getElementById("audio");
const title=document.getElementById("title");
const artist=document.getElementById("artist");
const play=document.getElementById("play");
const progress=document.getElementById("progress");
const songBox=document.getElementById("songs");


function loadSong(index){

current=index;

audio.src=songs[index].url;

title.innerHTML=songs[index].title;

artist.innerHTML=songs[index].artist;

}


function playPause(){

if(!audio.src){
loadSong(current);
}


if(playing){

audio.pause();

play.innerHTML="▶";

playing=false;


}else{

audio.play();

play.innerHTML="⏸";

playing=true;

}

}



function next(){

current++;

if(current>=songs.length){

current=0;

}

loadSong(current);

audio.play();

playing=true;

play.innerHTML="⏸";

}



function previous(){

current--;

if(current<0){

current=songs.length-1;

}

loadSong(current);

audio.play();

playing=true;

play.innerHTML="⏸";

}



songs.forEach((song,index)=>{

songBox.innerHTML += `

<div class="song" onclick="loadSong(${index})">

<div class="pic">🎵</div>

<div class="info">

<h3>${song.title}</h3>

<p>${song.artist}</p>

</div>

<div class="like">▶</div>

</div>

`;

});



audio.addEventListener("timeupdate",()=>{

if(audio.duration){

progress.value=(audio.currentTime/audio.duration)*100;

}

});


progress.addEventListener("input",()=>{

if(audio.duration){

audio.currentTime=(progress.value/100)*audio.duration;

}

});


</script>


</body>
</html>
