<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madhu Music World</title>

<meta name="theme-color" content="#ff0099">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#07070d;
color:white;
padding-bottom:90px;
}

.app{
max-width:700px;
margin:auto;
padding:20px 18px 30px;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.header h1{
font-size:32px;
font-weight:800;
}

.searchBtn{
font-size:32px;
cursor:pointer;
}

/* SEARCH */

.searchBox{
display:none;
margin-top:18px;
}

.searchBox.show{
display:block;
}

.searchBox input{
width:100%;
padding:15px 18px;
border-radius:20px;
border:1px solid #333;
background:#171720;
color:white;
font-size:16px;
outline:none;
}

.searchBox input:focus{
border-color:#ff0099;
}

/* HERO */

.hero{
margin-top:28px;
height:300px;
border-radius:35px;
padding:35px;
display:flex;
align-items:flex-end;
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 75% 35%,#ff0099 0%,transparent 25%),
linear-gradient(135deg,#31004d,#15002a,#080012);
box-shadow:0 10px 40px #000;
}

.hero:after{
content:"🎧";
position:absolute;
right:45px;
top:55px;
font-size:120px;
opacity:.45;
}

.heroText{
position:relative;
z-index:2;
}

.hero h2{
font-size:42px;
margin-bottom:12px;
}

.hero p{
font-size:20px;
color:#ddd;
}

/* CATEGORY */

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:30px;
}

.category{
padding:20px 15px;
border-radius:25px;
background:#12121e;
border:1px solid #303047;
color:white;
font-size:20px;
cursor:pointer;
transition:.2s;
}

.category:hover,
.category.active{
background:linear-gradient(135deg,#ff0099,#c000ff);
border-color:#ff0099;
transform:translateY(-2px);
}

/* PLAYER */

.card{
background:#15151f;
border:1px solid #29293a;
border-radius:35px;
padding:30px;
margin-top:35px;
text-align:center;
box-shadow:0 10px 35px #000;
}

.cover{
height:350px;
border-radius:30px;
background:
radial-gradient(circle at center,#ff0099 0%,#26003d 35%,#10001d 70%);
display:flex;
align-items:center;
justify-content:center;
font-size:130px;
overflow:hidden;
}

.title{
font-size:32px;
font-weight:bold;
margin-top:28px;
word-break:break-word;
}

.artist{
color:#aaa;
font-size:20px;
margin-top:10px;
}

.status{
color:#ff0099;
font-size:18px;
margin-top:10px;
min-height:22px;
}

input[type="range"]{
width:100%;
margin-top:25px;
accent-color:#ff0099;
height:5px;
cursor:pointer;
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:45px;
margin-top:28px;
}

button{
border:0;
background:none;
color:white;
cursor:pointer;
}

.control{
font-size:35px;
}

.play{
background:#ff0099;
color:white;
height:90px;
width:90px;
border-radius:50%;
font-size:35px;
box-shadow:0 0 25px #ff009955;
}

.favoriteBtn{
font-size:38px;
margin-top:25px;
}

/* STATION SECTION */

.stationHeader{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:40px;
margin-bottom:15px;
}

.stationHeader h2{
font-size:30px;
}

.online{
color:#ff0099;
font-size:18px;
}

#loading{
text-align:center;
color:#aaa;
padding:30px 10px;
font-size:18px;
}

#message{
text-align:center;
color:#aaa;
padding:30px 10px;
font-size:18px;
}

/* SONG LIST */

.song{
display:flex;
align-items:center;
background:#15151f;
border:1px solid #29293a;
padding:16px;
border-radius:22px;
margin-top:14px;
cursor:pointer;
transition:.2s;
}

.song:hover{
border-color:#ff0099;
transform:translateY(-2px);
}

.pic{
height:60px;
width:60px;
min-width:60px;
background:linear-gradient(135deg,#35005a,#ff0099);
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
margin-right:15px;
}

.info{
flex:1;
min-width:0;
}

.info h3{
font-size:18px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.info p{
color:#888;
margin-top:5px;
font-size:14px;
}

.songLike{
font-size:25px;
margin-left:10px;
}

/* NAV */

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111119;
border-top:1px solid #29293a;
display:flex;
justify-content:space-around;
padding:12px 5px 10px;
z-index:100;
}

.navItem{
text-align:center;
color:#888;
font-size:14px;
cursor:pointer;
min-width:70px;
}

.navIcon{
font-size:27px;
margin-bottom:4px;
}

.navItem.active{
color:#ff0099;
}

/* RESPONSIVE */

@media(max-width:520px){

.app{
padding:18px 14px 30px;
}

.header h1{
font-size:28px;
}

.hero{
height:260px;
padding:28px;
}

.hero h2{
font-size:34px;
}

.hero p{
font-size:17px;
}

.cover{
height:300px;
}

.title{
font-size:27px;
}

.card{
padding:22px 18px;
}

.controls{
gap:30px;
}

}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<h1>Madhu Music World 🎵</h1>

<div class="searchBtn" onclick="toggleSearch()">
🔎
</div>

</div>


<!-- SEARCH -->

<div class="searchBox" id="searchBox">

<input
type="text"
id="searchInput"
placeholder="Search station..."
oninput="searchStations()"
>

</div>


<!-- HERO -->

<div class="hero">

<div class="heroText">

<h2>Feel The Music</h2>

<p>Live Online Radio • Your Music World</p>

</div>

</div>


<!-- CATEGORY -->

<div class="categories">

<button class="category active" onclick="selectCategory('all',this)">
🎵 All Stations
</button>

<button class="category" onclick="selectCategory('bengali',this)">
🎶 Bengali
</button>

<button class="category" onclick="selectCategory('hindi',this)">
🎵 Hindi
</button>

<button class="category" onclick="selectCategory('rabindra',this)">
🎼 Rabindra Sangeet
</button>

<button class="category" onclick="selectCategory('bhajan',this)">
🕉️ Bhajan
</button>

</div>


<!-- PLAYER -->

<div class="card">

<div class="cover">
🎧
</div>

<div class="title" id="title">
Select Station
</div>

<div class="artist" id="artist">
Online Music
</div>

<div class="status" id="status">
Choose a station below
</div>

<input
type="range"
id="progress"
min="0"
max="100"
value="0"
>

<div class="controls">

<button
class="control"
onclick="previousStation()"
>
⏮
</button>

<button
class="play"
onclick="playPause()"
id="play"
>
▶
</button>

<button
class="control"
onclick="nextStation()"
>
⏭
</button>

</div>

<button
class="favoriteBtn"
onclick="toggleFavoriteCurrent()"
id="favoriteBtn"
>
♡
</button>

</div>


<!-- STATION LIST -->

<div class="stationHeader">

<h2 id="stationTitle">
All Stations
</h2>

<div class="online">
Online
</div>

</div>


<div id="loading">
Loading stations...
</div>

<div id="songs"></div>

<div id="message"></div>


</div>


<!-- NAVIGATION -->

<div class="nav">

<div
class="navItem active"
onclick="showHome(this)"
>
<div class="navIcon">⌂</div>
Home
</div>

<div
class="navItem"
onclick="showMusic(this)"
>
<div class="navIcon">♫</div>
Music
</div>

<div
class="navItem"
onclick="showFavorites(this)"
>
<div class="navIcon">♡</div>
Favorite
</div>

<div
class="navItem"
onclick="showLibrary(this)"
>
<div class="navIcon">▱</div>
Library
</div>

</div>


<audio id="audio"></audio>


<script>

/* =========================================
   MADHU MUSIC WORLD
   ONLINE RADIO PLAYER
========================================= */

const audio = document.getElementById("audio");

const title = document.getElementById("title");

const artist = document.getElementById("artist");

const statusText = document.getElementById("status");

const playButton = document.getElementById("play");

const progress = document.getElementById("progress");

const songsBox = document.getElementById("songs");

const loading = document.getElementById("loading");

const message = document.getElementById("message");

const stationTitle = document.getElementById("stationTitle");

const favoriteBtn = document.getElementById("favoriteBtn");


let stations = [];

let currentIndex = -1;

let currentCategory = "all";

let favorites =
JSON.parse(localStorage.getItem("madhuFavorites") || "[]");


/* RADIO BROWSER SERVERS */

const API_SERVERS = [

"https://de1.api.radio-browser.info",

"https://nl1.api.radio-browser.info",

"https://at1.api.radio-browser.info"

];


/* CATEGORY SEARCH */

const categories = {

all:{
name:"All Stations",
queries:[
{name:"music",limit:20},
{tag:"music",limit:20}
]
},

bengali:{
name:"Bengali",
queries:[
{language:"Bengali",limit:30},
{language:"Bangla",limit:30},
{tag:"bengali",limit:30},
{name:"Bangla",limit:30}
]
},

hindi:{
name:"Hindi",
queries:[
{language:"Hindi",limit:30},
{tag:"hindi",limit:30},
{name:"Hindi",limit:30}
]
},

rabindra:{
name:"Rabindra Sangeet",
queries:[
{name:"Rabindra",limit:30},
{tag:"rabindra",limit:30},
{tag:"rabindrasangeet",limit:30},
{name:"Tagore",limit:30}
]
},

bhajan:{
name:"Bhajan",
queries:[
{tag:"bhajan",limit:30},
{tag:"devotional",limit:30},
{name:"Bhajan",limit:30},
{name:"Bhakti",limit:30}
]
}

};


/* =========================================
   API REQUEST
========================================= */

async function getStations(query){

for(const server of API_SERVERS){

try{

const params = new URLSearchParams();

for(const key in query){

params.set(key,query[key]);

}

params.set("hidebroken","true");

params.set("order","clickcount");

params.set("reverse","true");

params.set("limit",query.limit || 30);


const url =
server +
"/json/stations/search?" +
params.toString();


const response =
await fetch(url,{
method:"GET",
headers:{
"Accept":"application/json"
}
});


if(!response.ok){
continue;
}


const data = await response.json();


if(Array.isArray(data) && data.length){

return data;

}

}catch(error){

console.log("Radio server error:",error);

}

}

return [];

}


/* =========================================
   LOAD CATEGORY
========================================= */

async function loadCategory(category){

currentCategory = category;

stations = [];

currentIndex = -1;

audio.pause();

audio.src = "";

playButton.innerHTML = "▶";

title.innerText = "Select Station";

artist.innerText = "Online Music";

statusText.innerText = "Loading stations...";

stationTitle.innerText =
categories[category].name;

songsBox.innerHTML = "";

message.innerHTML = "";

loading.style.display = "block";


let results = [];


for(const query of categories[category].queries){

const data =
await getStations(query);

results = results.concat(data);

if(results.length >= 40){

break;

}

}


/* REMOVE DUPLICATES */

const unique = [];

const seen = new Set();


for(const station of results){

const id =
station.stationuuid ||
station.url_resolved ||
station.url;


if(!id || seen.has(id)){

continue;

}

seen.add(id);

unique.push(station);

}


/* KEEP ONLY USABLE STREAMS */

stations =
unique.filter(station => {

return (
station.url_resolved ||
station.url
);

}).slice(0,40);


loading.style.display = "none";


renderStations();

}


/* =========================================
   RENDER STATIONS
========================================= */

function renderStations(){

songsBox.innerHTML = "";

message.innerHTML = "";


if(!stations.length){

message.innerHTML =
"এই category-তে এখন কোনো working online station পাওয়া যায়নি।<br><br>অন্য category চেষ্টা করো।";

return;

}


stations.forEach((station,index)=>{

const div =
document.createElement("div");

div.className = "song";


const name =
station.name || "Online Radio";


const country =
station.country || "Online Radio";


const tags =
station.tags || "";


const isFav =
favorites.includes(
station.stationuuid
);


div.innerHTML = `

<div class="pic">
🎵
</div>

<div class="info">

<h3>${escapeHTML(name)}</h3>

<p>
${escapeHTML(country)}
${tags ? " • " + escapeHTML(tags.split(",").slice(0,2).join(", ")) : ""}
</p>

</div>

<div
class="songLike"
onclick="event.stopPropagation();toggleFavorite(${index})"
>
${isFav ? "♥" : "♡"}
</div>

`;


div.onclick =
function(){

selectStation(index);

};


songsBox.appendChild(div);

});

}


/* =========================================
   SELECT STATION
========================================= */

function selectStation(index){

if(!stations[index]) return;


currentIndex = index;

const station = stations[index];


title.innerText =
station.name || "Online Radio";


artist.innerText =
station.country || "Online Music";


statusText.innerText =
"Ready to play";


updateFavoriteButton();


const stream =
station.url_resolved || station.url;


audio.src = stream;

audio.load();


/* COUNT STATION CLICK */

if(station.stationuuid){

fetch(
"https://de1.api.radio-browser.info/json/url/" +
station.stationuuid
).catch(()=>{});

}


/* TRY PLAY */

audio.play()
.then(()=>{

playButton.innerHTML = "❚❚";

statusText.innerText =
"▶ Playing Online";

})
.catch(error=>{

console.log(error);

playButton.innerHTML = "▶";

statusText.innerText =
"Press ▶ to play";

});

}


/* =========================================
   PLAY / PAUSE
========================================= */

function playPause(){

if(!audio.src){

if(stations.length){

selectStation(0);

}else{

statusText.innerText =
"Choose a station first";

}

return;

}


if(audio.paused){

audio.play()
.then(()=>{

playButton.innerHTML = "❚❚";

statusText.innerText =
"▶ Playing Online";

})
.catch(()=>{

statusText.innerText =
"এই station-এর stream চালানো যাচ্ছে না";

});

}else{

audio.pause();

playButton.innerHTML = "▶";

statusText.innerText =
"Paused";

}

}


/* =========================================
   NEXT
========================================= */

function nextStation(){

if(!stations.length) return;


let next =
currentIndex + 1;


if(next >= stations.length){

next = 0;

}


selectStation(next);

}


/* =========================================
   PREVIOUS
========================================= */

function previousStation(){

if(!stations.length) return;


let previous =
currentIndex - 1;


if(previous < 0){

previous = stations.length - 1;

}


selectStation(previous);

}


/* =========================================
   AUDIO EVENTS
========================================= */

audio.addEventListener(
"play",
function(){

playButton.innerHTML = "❚❚";

}
);


audio.addEventListener(
"pause",
function(){

playButton.innerHTML = "▶";

}
);


audio.addEventListener(
"error",
function(){

statusText.innerText =
"Stream unavailable — Next station try করো";

playButton.innerHTML = "▶";

}
);


/* =========================================
   PROGRESS
========================================= */

audio.addEventListener(
"timeupdate",
function(){

if(audio.duration &&
isFinite(audio.duration)){

progress.value =
(audio.currentTime / audio.duration) * 100;

}

}
);


progress.addEventListener(
"input",
function(){

if(audio.duration &&
isFinite(audio.duration)){

audio.currentTime =
(progress.value / 100) *
audio.duration;

}

}
);


/* =========================================
   CATEGORY
========================================= */

function selectCategory(category,button){

document
.querySelectorAll(".category")
.forEach(btn =>
btn.classList.remove("active")
);


if(button){

button.classList.add("active");

}


loadCategory(category);

}


/* =========================================
   SEARCH
========================================= */

function toggleSearch(){

const box =
document.getElementById("searchBox");

box.classList.toggle("show");


if(box.classList.contains("show")){

document
.getElementById("searchInput")
.focus();

}

}


let searchTimer;


function searchStations(){

clearTimeout(searchTimer);


searchTimer =
setTimeout(async function(){

const text =
document
.getElementById("searchInput")
.value.trim();


if(!text){

loadCategory(currentCategory);

return;

}


loading.style.display = "block";

songsBox.innerHTML = "";

message.innerHTML = "";


let result = [];


result =
await getStations({
name:text,
limit:40
});


stations =
result.filter(station =>
station.url_resolved ||
station.url
).slice(0,40);


currentIndex = -1;

loading.style.display = "none";

stationTitle.innerText =
"Search: " + text;

renderStations();

},500);

}


/* =========================================
   FAVORITES
========================================= */

function toggleFavorite(index){

const station =
stations[index];

if(!station) return;


const id =
station.stationuuid;


if(!id) return;


if(favorites.includes(id)){

favorites =
favorites.filter(item =>
item !== id
);

}else{

favorites.push(id);

}


localStorage.setItem(
"madhuFavorites",
JSON.stringify(favorites)
);


renderStations();

updateFavoriteButton();

}


function toggleFavoriteCurrent(){

if(currentIndex < 0) return;


toggleFavorite(currentIndex);

}


function updateFavoriteButton(){

if(currentIndex < 0){

favoriteBtn.innerText = "♡";

return;

}


const station =
stations[currentIndex];


if(!station){

favoriteBtn.innerText = "♡";

return;

}


favoriteBtn.innerText =
favorites.includes(station.stationuuid)
? "♥"
: "♡";

}


/* =========================================
   FAVORITE PAGE
========================================= */

function showFavorites(nav){

setActiveNav(nav);

stationTitle.innerText =
"Favorite Stations";

loading.style.display = "none";

songsBox.innerHTML = "";

message.innerHTML = "";


const favStations =
stations.filter(station =>
favorites.includes(station.stationuuid)
);


if(!favStations.length){

message.innerHTML =
"এখনো কোনো Favorite station নেই।<br><br>♡ চাপলে station এখানে থাকবে।";

return;

}


const oldStations =
stations;

stations =
favStations;

renderStations();

stations =
oldStations;

}


/* =========================================
   NAVIGATION
========================================= */

function setActiveNav(nav){

document
.querySelectorAll(".navItem")
.forEach(item =>
item.classList.remove("active")
);


if(nav){

nav.classList.add("active");

}

}


function showHome(nav){

setActiveNav(nav);

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function showMusic(nav){

setActiveNav(nav);

window.scrollTo({
top:0,
behavior:"smooth"
});

document
.querySelector(".categories")
.scrollIntoView({
behavior:"smooth"
});

}


function showLibrary(nav){

setActiveNav(nav);

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

loadCategory("all");

</script>

</body>
</html>
