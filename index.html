<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#08070d">
<meta name="description" content="Madhu Music World - Live Radio">
<title>Madhu Music World</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  background:#07060b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
  padding-bottom:155px;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
}

/* HEADER */

.header{
  height:86px;
  display:flex;
  align-items:center;
  padding:0 28px;
  border-bottom:1px solid #24212d;
  background:#08070d;
  position:sticky;
  top:0;
  z-index:50;
}

.menu-btn{
  width:48px;
  height:48px;
  background:transparent;
  color:#fff;
  font-size:34px;
}

.logo-text{
  margin-left:20px;
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo-note{
  color:#ff009d;
  margin-left:7px;
  font-size:34px;
}

.search-btn{
  margin-left:auto;
  width:56px;
  height:56px;
  border-radius:50%;
  color:#fff;
  background:#11101a;
  border:1px solid #373344;
  font-size:28px;
}

/* MAIN */

main{
  padding:28px;
}

/* HERO */

.hero{
  min-height:315px;
  border:1px solid #c6009a;
  border-radius:30px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  padding:42px;

  background:
    radial-gradient(circle at 78% 45%,rgba(255,0,180,.60),transparent 27%),
    radial-gradient(circle at 30% 80%,rgba(80,0,255,.40),transparent 45%),
    linear-gradient(120deg,#160019,#19002e 55%,#09000d);

  box-shadow:
    0 0 35px rgba(255,0,180,.16),
    inset 0 0 50px rgba(160,0,255,.15);
}

.hero-content{
  position:relative;
  z-index:5;
  max-width:58%;
}

.hero h1{
  font-size:58px;
  line-height:1.05;
  margin-bottom:20px;
}

.hero p{
  font-size:22px;
  color:#dedbe5;
  line-height:1.5;
}

.hero-notes{
  position:absolute;
  right:7%;
  top:18%;
  font-size:42px;
  color:#ff009d;
  opacity:.45;
  transform:rotate(-8deg);
}

.headphones{
  position:absolute;
  right:8%;
  top:12%;
  width:260px;
  height:220px;
  opacity:.9;
}

.headphones .arc{
  position:absolute;
  width:220px;
  height:170px;
  border:22px solid #171522;
  border-bottom:0;
  border-radius:130px 130px 0 0;
  left:20px;
  top:5px;
  box-shadow:
    0 0 10px #ff009d,
    0 0 35px rgba(255,0,170,.5);
}

.headphones .ear{
  position:absolute;
  width:72px;
  height:105px;
  background:linear-gradient(145deg,#282237,#08070d);
  border:4px solid #ff009d;
  border-radius:30px;
  top:95px;
}

.headphones .left{
  left:12px;
}

.headphones .right{
  right:12px;
}

.headphones .band{
  position:absolute;
  width:90px;
  height:15px;
  background:#ff009d;
  top:78px;
  left:85px;
  opacity:.7;
}

/* CATEGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:25px;
}

.category{
  min-height:145px;
  border-radius:22px;
  padding:18px 10px;
  background:linear-gradient(145deg,#111019,#0b0a10);
  border:1px solid #302d3b;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.category:active{
  transform:scale(.97);
}

.category.active{
  border-color:#ff009d;
  box-shadow:
    0 0 20px rgba(255,0,157,.28),
    inset 0 0 25px rgba(255,0,157,.07);
}

.category-icon{
  font-size:43px;
  margin-bottom:12px;
}

.category-title{
  font-size:18px;
  font-weight:700;
}

.category-sub{
  margin-top:6px;
  font-size:14px;
  color:#aaa6b2;
}

/* SECTION */

.section-title{
  margin:30px 3px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-title h2{
  font-size:25px;
}

.view-all{
  color:#ff009d;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

/* STATIONS */

.station-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.station{
  min-height:100px;
  border-radius:22px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:16px;
  background:linear-gradient(145deg,#111019,#0c0b12);
  border:1px solid #292634;
}

.station-logo{
  width:68px;
  height:68px;
  border-radius:17px;
  background:linear-gradient(145deg,#26004c,#71006d);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  flex-shrink:0;
  overflow:hidden;
}

.station-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.station-info{
  flex:1;
  min-width:0;
}

.station-name{
  font-size:19px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.station-meta{
  color:#aaa6b2;
  margin-top:7px;
  font-size:14px;
}

.station-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.favorite{
  width:45px;
  height:45px;
  border-radius:50%;
  background:transparent;
  color:#ff009d;
  font-size:29px;
}

.play{
  width:56px;
  height:56px;
  border-radius:50%;
  color:#fff;
  background:linear-gradient(145deg,#ff009d,#ff0080);
  font-size:22px;
  box-shadow:0 0 20px rgba(255,0,157,.25);
}

/* PLAYER */

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:68px;
  z-index:100;
  min-height:86px;
  background:rgba(14,12,22,.97);
  backdrop-filter:blur(18px);
  border-top:1px solid #302b3b;
  display:none;
  align-items:center;
  padding:12px 25px;
}

.player.show{
  display:flex;
}

.player-logo{
  width:58px;
  height:58px;
  border-radius:15px;
  background:#29005c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  flex-shrink:0;
  overflow:hidden;
}

.player-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.player-info{
  flex:1;
  min-width:0;
  margin-left:15px;
}

.player-name{
  font-size:17px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-status{
  color:#aaa6b2;
  font-size:13px;
  margin-top:5px;
}

.player-controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.player-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  color:#fff;
  background:#ff009d;
  font-size:21px;
}

.close-player{
  background:transparent;
  color:#aaa;
  font-size:28px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:rgba(15,14,22,.98);
  border-top:1px solid #292634;
  z-index:110;
  display:flex;
}

.nav-item{
  flex:1;
  background:transparent;
  color:#8f8b97;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
}

.nav-icon{
  font-size:25px;
}

.nav-label{
  font-size:12px;
}

.nav-item.active{
  color:#ff009d;
}

/* SEARCH */

.search-box{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(5,4,8,.98);
  display:none;
  padding:25px;
  overflow:auto;
}

.search-box.show{
  display:block;
}

.search-top{
  display:flex;
  gap:10px;
}

.search-input{
  flex:1;
  height:55px;
  border-radius:30px;
  border:1px solid #403b4b;
  outline:none;
  background:#111019;
  color:#fff;
  padding:0 20px;
  font-size:17px;
}

.search-close{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#ff009d;
  color:#fff;
  font-size:23px;
}

/* MENU */

.side-menu{
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.65);
  display:none;
}

.side-menu.show{
  display:block;
}

.menu-panel{
  width:310px;
  max-width:85%;
  height:100%;
  background:#0c0b12;
  padding:28px 20px;
  box-shadow:10px 0 40px rgba(0,0,0,.5);
}

.menu-title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:25px;
}

.menu-line{
  height:55px;
  display:flex;
  align-items:center;
  gap:14px;
  color:#ddd;
  font-size:17px;
  border-bottom:1px solid #24212d;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 15px;
  color:#aaa6b2;
  line-height:1.6;
}

/* MOBILE */

@media(max-width:700px){

  .header{
    height:78px;
    padding:0 16px;
  }

  .logo-text{
    margin-left:10px;
    font-size:25px;
  }

  .logo-note{
    font-size:29px;
  }

  .search-btn{
    width:50px;
    height:50px;
  }

  main{
    padding:18px 16px;
  }

  .hero{
    min-height:360px;
    padding:30px;
    border-radius:27px;
    align-items:flex-end;
  }

  .hero-content{
    max-width:100%;
  }

  .hero h1{
    font-size:46px;
  }

  .hero p{
    font-size:18px;
  }

  .headphones{
    transform:scale(.82);
    transform-origin:top right;
    right:0;
    top:5px;
    opacity:.65;
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .category{
    min-height:125px;
  }

  .category-icon{
    font-size:36px;
  }

  .station{
    padding:12px;
    gap:11px;
  }

  .station-logo{
    width:58px;
    height:58px;
    font-size:25px;
  }

  .station-name{
    font-size:16px;
  }

  .station-meta{
    font-size:12px;
  }

  .favorite{
    width:40px;
    font-size:27px;
  }

  .play{
    width:52px;
    height:52px;
  }

  .player{
    bottom:68px;
    padding:10px 13px;
  }

  .player-logo{
    width:53px;
    height:53px;
  }

  .player-name{
    font-size:15px;
  }

  .player-controls{
    gap:2px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<button class="menu-btn" onclick="openMenu()">☰</button>

<div class="logo-text">
Madhu Music World
<span class="logo-note">♫</span>
</div>

<button class="search-btn" onclick="openSearch()">🔎</button>

</header>

<main>

<section class="hero">

<div class="hero-content">
<h1>Feel The Music</h1>
<p>Live Radio • Bengali • Retro • Evergreen</p>
</div>

<div class="hero-notes">♫ ♪</div>

<div class="headphones">
  <div class="arc"></div>
  <div class="band"></div>
  <div class="ear left"></div>
  <div class="ear right"></div>
</div>

</section>


<section class="categories">

<button class="category active"
onclick="loadCategory('all',this)">
<div class="category-icon">📻</div>
<div class="category-title">All Stations</div>
<div class="category-sub">Live Radio</div>
</button>

<button class="category"
onclick="loadCategory('bengali',this)">
<div class="category-icon">🎵</div>
<div class="category-title">বাংলা গান</div>
<div class="category-sub">Bangla Radio</div>
</button>

<button class="category"
onclick="loadCategory('oldbengali',this)">
<div class="category-icon">🕰️</div>
<div class="category-title">পুরোনো বাংলা</div>
<div class="category-sub">70s • 80s • 90s</div>
</button>

<button class="category"
onclick="loadCategory('hindi',this)">
<div class="category-icon">🎶</div>
<div class="category-title">Hindi Oldies</div>
<div class="category-sub">Retro Hits</div>
</button>

<button class="category"
onclick="loadCategory('english',this)">
<div class="category-icon">🎸</div>
<div class="category-title">English Retro</div>
<div class="category-sub">Classic Hits</div>
</button>

<button class="category"
onclick="loadCategory('rabindra',this)">
<div class="category-icon">🎼</div>
<div class="category-title">রবীন্দ্রসঙ্গীত</div>
<div class="category-sub">Rabindra Sangeet</div>
</button>

<button class="category"
onclick="loadCategory('bhajan',this)">
<div class="category-icon">🕉️</div>
<div class="category-title">ভজন</div>
<div class="category-sub">Devotional</div>
</button>

<button class="category"
onclick="showFavorites(this)">
<div class="category-icon">💜</div>
<div class="category-title">My Favorite</div>
<div class="category-sub">Saved Stations</div>
</button>

</section>


<div class="section-title">

<h2 id="sectionTitle">Popular Stations</h2>

<div class="view-all"
onclick="loadCategory('all',null)">
View All ›
</div>

</div>


<div id="stations" class="station-list">

<div class="empty">
⏳ Live radio stations খোঁজা হচ্ছে...
</div>

</div>

</main>

</div>


<!-- PLAYER -->

<div id="player" class="player">

<div id="playerLogo" class="player-logo">
🎧
</div>

<div class="player-info">

<div id="playerName" class="player-name">
No station selected
</div>

<div id="playerStatus" class="player-status">
Select a radio station
</div>

</div>

<div class="player-controls">

<button
class="player-btn"
id="playerButton"
onclick="togglePlayer()">
▶
</button>

<button
class="player-btn close-player"
onclick="stopPlayer()">
×
</button>

</div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

<button
class="nav-item active"
onclick="navHome(this)">

<div class="nav-icon">🏠</div>
<div class="nav-label">Home</div>

</button>


<button
class="nav-item"
onclick="loadCategory('all',this)">

<div class="nav-icon">🎵</div>
<div class="nav-label">Music</div>

</button>


<button
class="nav-item"
onclick="showFavorites(this)">

<div class="nav-icon">♥</div>
<div class="nav-label">Favorite</div>

</button>


<button
class="nav-item"
onclick="showLibrary(this)">

<div class="nav-icon">▱</div>
<div class="nav-label">Library</div>

</button>

</nav>


<!-- SEARCH -->

<div id="searchBox" class="search-box">

<div class="search-top">

<input
id="searchInput"
class="search-input"
placeholder="Search radio station..."
oninput="searchStations(this.value)"
>

<button
class="search-close"
onclick="closeSearch()">
×
</button>

</div>

<div id="searchResults"></div>

</div>


<!-- SIDE MENU -->

<div
id="sideMenu"
class="side-menu"
onclick="closeMenu(event)">

<div
class="menu-panel"
onclick="event.stopPropagation()">

<div class="menu-title">
🎵 Madhu Music World
</div>

<div class="menu-line">🏠 Home</div>
<div class="menu-line">📻 Live Radio</div>
<div class="menu-line">🎶 Bengali Music</div>
<div class="menu-line">🕰️ Old Bengali</div>
<div class="menu-line">💜 My Favorites</div>
<div class="menu-line">ℹ️ About</div>

</div>

</div>


<audio id="audio" preload="none"></audio>


<script>

/* =====================================================
   MADHU MUSIC WORLD
===================================================== */

const audio = document.getElementById("audio");

let currentStation = null;
let stations = [];
let currentCategory = "all";

let favorites = [];

try{
  favorites =
    JSON.parse(
      localStorage.getItem("madhuFavorites") || "[]"
    );
}catch(e){
  favorites = [];
}


/* =====================================================
   RADIO SERVERS
===================================================== */

const RADIO_SERVERS = [

"https://de1.api.radio-browser.info",
"https://nl1.api.radio-browser.info",
"https://at1.api.radio-browser.info"

];


/* =====================================================
   STATION ID
   Favorite-এর জন্য সবচেয়ে গুরুত্বপূর্ণ
===================================================== */

function getStationId(station){

  if(!station) return "";

  return String(
    station.stationuuid ||
    station.url_resolved ||
    station.url ||
    station.name ||
    ""
  ).trim();

}


/* =====================================================
   FAVORITE CHECK
===================================================== */

function isFavorite(station){

  const id = getStationId(station);

  if(!id) return false;

  return favorites.some(
    item => getStationId(item) === id
  );

}


/* =====================================================
   SAVE FAVORITES
===================================================== */

function saveFavorites(){

  try{

    localStorage.setItem(
      "madhuFavorites",
      JSON.stringify(favorites)
    );

  }catch(error){

    console.log(
      "Favorite save error:",
      error
    );

  }

}


/* =====================================================
   RADIO API
===================================================== */

async function getStations(params={}){

  for(const server of RADIO_SERVERS){

    try{

      const query = {

        ...params,

        hidebroken:"true",

        order:"clickcount",

        reverse:"true",

        limit:"50"

      };

      const url =
        server +
        "/json/stations/search?" +
        new URLSearchParams(query);

      const response =
        await fetch(url);

      if(!response.ok){
        continue;
      }

      const data =
        await response.json();

      if(Array.isArray(data) && data.length){

        return data;

      }

    }catch(error){

      console.log(
        "Server failed:",
        server
      );

    }

  }

  return [];

}


/* =====================================================
   CLEAN
===================================================== */

function cleanStations(list){

  const seen = new Set();

  return list.filter(station=>{

    if(!station) return false;

    if(!station.url_resolved) return false;

    const id =
      getStationId(station).toLowerCase();

    if(!id) return false;

    if(seen.has(id)) return false;

    seen.add(id);

    return true;

  });

}


/* =====================================================
   LANGUAGE FILTER
===================================================== */

function languageIs(station,language){

  const value =
    String(
      station.language || ""
    ).toLowerCase();

  return value.includes(language);
}


/* =====================================================
   CATEGORY
===================================================== */

async function loadCategory(
  type="all",
  button=null
){

  currentCategory = type;

  document
    .querySelectorAll(".category")
    .forEach(x=>{
      x.classList.remove("active");
    });

  if(
    button &&
    button.classList.contains("category")
  ){

    button.classList.add("active");

  }

  let params = {};
  let title = "Popular Stations";

  /* বাংলা */

  if(type==="bengali"){

    params = {
      language:"bengali"
    };

    title = "বাংলা লাইভ রেডিও";

  }

  /* পুরোনো বাংলা */

  else if(type==="oldbengali"){

    params = {
      language:"bengali",
      tag:"oldies"
    };

    title =
      "পুরোনো বাংলা • 70s • 80s • 90s";

  }

  /* HINDI */

  else if(type==="hindi"){

    params = {
      language:"hindi",
      tag:"oldies"
    };

    title = "Hindi Oldies";

  }

  /* ENGLISH */

  else if(type==="english"){

    params = {
      language:"english",
      tag:"oldies"
    };

    title = "English Retro";

  }

  /* RABINDRA */

  else if(type==="rabindra"){

    params = {
      language:"bengali",
      tag:"rabindra"
    };

    title = "রবীন্দ্রসঙ্গীত";

  }

  /* BHAJAN */

  else if(type==="bhajan"){

    params = {
      tag:"bhajan"
    };

    title = "ভজন • Devotional";

  }

  document
    .getElementById("sectionTitle")
    .textContent = title;

  showLoading();

  let result =
    await getStations(params);

  result =
    cleanStations(result);


  /*
    Extra filtering.
    এতে বাংলা category-তে
    ভুল করে English/Hindi station
    ঢোকার সম্ভাবনা কমে।
  */

  if(type==="bengali"){

    result =
      result.filter(
        station =>
          languageIs(station,"bengali")
      );

  }

  else if(type==="oldbengali"){

    result =
      result.filter(station=>{

        const language =
          String(
            station.language || ""
          ).toLowerCase();

        const tags =
          String(
            station.tags || ""
          ).toLowerCase();

        return (
          language.includes("bengali") &&
          (
            tags.includes("old") ||
            tags.includes("retro") ||
            tags.includes("80") ||
            tags.includes("90")
          )
        );

      });

  }

  else if(type==="hindi"){

    result =
      result.filter(
        station =>
          languageIs(station,"hindi")
      );

  }

  else if(type==="english"){

    result =
      result.filter(
        station =>
          languageIs(station,"english")
      );

  }

  else if(type==="rabindra"){

    result =
      result.filter(station=>{

        const text =
          (
            (station.name || "") +
            " " +
            (station.tags || "")
          ).toLowerCase();

        return (
          text.includes("rabindra") ||
          text.includes("tagore")
        );

      });

  }


  stations = result;

  renderStations(stations);

}


/* =====================================================
   RENDER STATIONS
===================================================== */

function renderStations(list){

  const container =
    document.getElementById("stations");

  if(!Array.isArray(list) || !list.length){

    container.innerHTML = `

      <div class="empty">

        😔 এই মুহূর্তে কোনো স্টেশন পাওয়া যায়নি।

        <br><br>

        অন্য category চেষ্টা করুন।

      </div>

    `;

    return;

  }


  container.innerHTML =
    list.map((station,index)=>{

      const fav =
        isFavorite(station);

      let logo = "🎵";

      if(station.favicon){

        logo = `

          <img
          src="${escapeAttr(station.favicon)}"
          onerror="this.style.display='none'"
          >

        `;

      }


      return `

        <div class="station">

          <div class="station-logo">

            ${logo}

          </div>


          <div class="station-info">

            <div class="station-name">

              ${escapeHtml(
                station.name
              )}

            </div>


            <div class="station-meta">

              ${escapeHtml(
                station.language ||
                "Radio"
              )}

              ${
                station.country
                ?
                " • " +
                escapeHtml(
                  station.country
                )
                :
                ""
              }

            </div>

          </div>


          <div class="station-actions">


            <button
              class="favorite"
              onclick="
                toggleFavorite(
                  event,
                  ${index}
                )
              "
              aria-label="Favorite">

              ${
                fav
                ? "♥"
                : "♡"
              }

            </button>


            <button
              class="play"
              onclick="
                playStation(
                  ${index}
                )
              "
              aria-label="Play">

              ▶

            </button>


          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(event,index){

  if(event){
    event.stopPropagation();
    event.preventDefault();
  }

  const station =
    stations[index];

  if(!station){

    console.log(
      "Favorite error: station not found"
    );

    return;

  }


  const id =
    getStationId(station);

  if(!id){

    alert(
      "এই station-টি Favorite করা যাচ্ছে না।"
    );

    return;

  }


  const position =
    favorites.findIndex(
      item =>
        getStationId(item) === id
    );


  if(position !== -1){

    /* REMOVE */

    favorites.splice(
      position,
      1
    );

  }else{

    /* ADD */

    favorites.push({

      stationuuid:
        station.stationuuid || "",

      name:
        station.name || "",

      url:
        station.url || "",

      url_resolved:
        station.url_resolved || "",

      favicon:
        station.favicon || "",

      language:
        station.language || "",

      country:
        station.country || "",

      tags:
        station.tags || ""

    });

  }


  saveFavorites();

  /*
    সাথে সাথে heart পরিবর্তন হবে
  */

  renderStations(stations);

}


/* =====================================================
   SHOW FAVORITES
===================================================== */

function showFavorites(button=null){

  /* bottom nav active */

  document
    .querySelectorAll(".nav-item")
    .forEach(x=>{
      x.classList.remove("active");
    });

  if(button &&
     button.classList.contains("nav-item")){

    button.classList.add("active");

  }else{

    const favNav =
      document.querySelectorAll(
        ".nav-item"
      )[2];

    if(favNav){
      favNav.classList.add("active");
    }

  }


  /* category active remove */

  document
    .querySelectorAll(".category")
    .forEach(x=>{
      x.classList.remove("active");
    });


  document
    .getElementById("sectionTitle")
    .textContent =
      "My Favorite";


  /*
    Important:
    নতুন array তৈরি করছি
  */

  stations =
    [...favorites];


  renderStations(
    stations
  );

}


/* =====================================================
   LIBRARY
===================================================== */

function showLibrary(button){

  document
    .querySelectorAll(".nav-item")
    .forEach(x=>{
      x.classList.remove("active");
    });

  if(button){
    button.classList.add("active");
  }


  document
    .querySelectorAll(".category")
    .forEach(x=>{
      x.classList.remove("active");
    });

    .getElementById("sectionTitle")
    .textContent =

  stations =
    [...favorites];

  );

}


/* =====================================================
   HOME
===================================================== */

function navHome(button){

  document
    .querySelectorAll(".nav-item")
    .forEach(x=>{
      x.classList.remove("active");
    });

  button.classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  loadCategory(
    "all",
    null
  );

}


/* =====================================================
   PLAY STATION
===================================================== */

function playStation(index){

  const station =
    stations[index];

  if(
    !station ||
    !station.url_resolved
  ){

    return;

  }


  currentStation =
    station;


  audio.src =
    station.url_resolved;


  audio.play()
  .then(()=>{

    updatePlayer(true);

  })
  .catch(error=>{

    console.log(
      "Playback error:",
      error
    );


    updatePlayer(false);


    document
      .getElementById(
        "playerStatus"
      )
      .textContent =
        "Stream চালু করা যাচ্ছে না";

  });

}


/* =====================================================
   PLAYER
===================================================== */

function updatePlayer(
  playing
){

  const player =
    document.getElementById(
      "player"
    );

  player.classList.add(
    "show"
  );


  document
    .getElementById(
      "playerName"
    )
    .textContent =
      currentStation
      ?
      currentStation.name
      :
      "No station";


  document
    .getElementById(
      "playerStatus"
    )
    .textContent =
      playing
      ?
      "🔴 Live Radio Streaming"
      :
      "Radio Stream";


  document
    .getElementById(
      "playerButton"
    )
    .textContent =
      playing
      ?
      "Ⅱ"
      :
      "▶";


  const logo =
    document.getElementById(
      "playerLogo"
    );


  if(
    currentStation &&
    currentStation.favicon
  ){

    logo.innerHTML = `

      <img
      src="${escapeAttr(
        currentStation.favicon
      )}"
      onerror="
        this.parentElement.innerHTML='🎧'
      "
      >

    `;

  }else{

    logo.textContent =
      "🎧";

  }

}


/* =====================================================
   TOGGLE PLAYER
===================================================== */

function togglePlayer(){

  if(!currentStation){
    return;
  }


  if(audio.paused){

    audio.play()
    .then(()=>{

      updatePlayer(true);

    })
    .catch(()=>{});

  }else{

    audio.pause();

    updatePlayer(false);

  }

}


/* =====================================================
   STOP
===================================================== */

function stopPlayer(){

  audio.pause();

  audio.removeAttribute(
    "src"
  );

  audio.load();

  currentStation = null;

  document
    .getElementById(
      "player"
    )
    .classList.remove(
      "show"
    );

}


/* =====================================================
   SEARCH
===================================================== */

function openSearch(){

  document
    .getElementById(
      "searchBox"
    )
    .classList.add(
      "show"
    );


  setTimeout(()=>{

    document
      .getElementById(
        "searchInput"
      )
      .focus();

  },100);

}


function closeSearch(){

  document
    .getElementById(
      "searchBox"
    )
    .classList.remove(
      "show"
    );

}


let searchTimer;


function searchStations(value){

  clearTimeout(
    searchTimer
  );


  value =
    String(value || "")
    .trim();


  if(!value){

    document
      .getElementById(
        "searchResults"
      )
      .innerHTML = "";

    return;

  }


  searchTimer =
    setTimeout(
      async()=>{

        const result =
          await getStations({
            name:value
          });


        const searchList =
          cleanStations(
            result
          );


        document
          .getElementById(
            "searchResults"
          )
          .innerHTML =
            searchList.length
            ?
            searchList.map(
              station => `

              <div
                class="station"
                style="margin-bottom:10px">

                <div class="station-logo">

                  ${
                    station.favicon
                    ?
                    `<img
                      src="${escapeAttr(
                        station.favicon
                      )}"
                      onerror="
                      this.style.display='none'
                      "
                    >`
                    :
                    "🎵"
                  }

                </div>


                <div class="station-info">

                  <div class="station-name">

                    ${escapeHtml(
                      station.name
                    )}

                  </div>


                  <div class="station-meta">

                    ${escapeHtml(
                      station.language ||
                      "Radio"
                    )}

                    ${
                      station.country
                      ?
                      " • " +
                      escapeHtml(
                        station.country
                      )
                      :
                      ""
                    }

                  </div>

                </div>


                <button
                  class="play"
                  onclick="
                    playSearchStation(
                      '${escapeJs(
                        station.url_resolved
                      )}',
                      '${escapeJs(
                        station.name
                      )}',
                      '${escapeJs(
                        station.favicon || ""
                      )}'
                    )
                  ">

                  ▶

                </button>

              </div>

            `
            ).join("")
            :
            `

            <div class="empty">
              কোনো স্টেশন পাওয়া যায়নি।
            </div>

            `;

      },
      450
    );

}


/* =====================================================
   SEARCH PLAY
===================================================== */

function playSearchStation(
  url,
  name,
  favicon
){

  currentStation = {

    name:name,

    url_resolved:url,

    favicon:favicon

  };


  audio.src =
    url;


  audio.play()
  .then(()=>{

    updatePlayer(true);

  })
  .catch(()=>{

    updatePlayer(false);

  });

}

   MENU
===================================================== */

function openMenu(){

  document
    .getElementById(
      "sideMenu"
    )
    .classList.add(
      "show"
    );

}


function closeMenu(event){

  if(
    event.target.id ===
    "sideMenu"

      .getElementById(
        "sideMenu"
      )
      .classList.remove(

      );

/* =====================================================
   LOADING
===================================================== */

function showLoading(){

  document
    .getElementById(
      "stations"
    )
    .innerHTML = `

      <div class="empty">

        ⏳ Live radio stations খোঁজা হচ্ছে...

      </div>

    `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttr(text){

  return String(text || "")
    .replace(/"/g,"%22")
    .replace(/</g,"")
    .replace(/>/g,"");

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(text){

  return String(text || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g," ")
    .replace(/\r/g," ");

}


/* =====================================================
   AUDIO EVENTS
===================================================== */

audio.addEventListener(
  "playing",
  ()=>{

    if(currentStation){

      updatePlayer(true);

    }

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    if(currentStation){

      updatePlayer(false);

    }

  }
);


audio.addEventListener(
  "error",
  ()=>{

    if(currentStation){

      document
        .getElementById(
          "playerStatus"
        )
        .textContent =
          "এই স্টেশনের stream এখন unavailable";


      document
        .getElementById(
          "playerButton"
        )
        .textContent =
          "▶";

    }

  }
);


/* =====================================================
   START
===================================================== */

loadCategory(
  "all",
  null
);

</script>
