<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madhu Music World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#080611;
    color:#fff;
    padding-bottom:85px;
}

.app{
    max-width:520px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#ff3d91;
}

.search{
    font-size:27px;
    cursor:pointer;
}

/* SEARCH */

.searchBox{
    display:none;
    margin-bottom:18px;
}

.searchBox input{
    width:100%;
    padding:14px 18px;
    border:1px solid #343044;
    border-radius:18px;
    background:#151225;
    color:white;
    outline:none;
    font-size:16px;
}

/* HERO */

.hero{
    background:linear-gradient(
        135deg,
        #240044,
        #7b1265,
        #14102c
    );
    border-radius:25px;
    padding:25px 20px;
    min-height:190px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    margin-bottom:20px;
    overflow:hidden;
    position:relative;
}

.hero:before{
    content:"🎧";
    position:absolute;
    right:20px;
    top:18px;
    font-size:105px;
    opacity:.75;
}

.hero h2{
    font-size:25px;
    position:relative;
    z-index:2;
}

.hero p{
    margin-top:8px;
    color:#ddd;
    position:relative;
    z-index:2;
}

/* CATEGORY */

.categories{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:25px;
}

.category{
    border:1px solid #302844;
    background:#151225;
    color:white;
    padding:15px 8px;
    border-radius:18px;
    font-size:15px;
    cursor:pointer;
}

.category.active{
    background:linear-gradient(135deg,#8d126f,#d51b76);
    border-color:#e73591;
}

/* PLAYER */

.player{
    background:#151320;
    border:1px solid #28233b;
    border-radius:28px;
    padding:18px;
    margin-bottom:25px;
}

.cover{
    height:260px;
    border-radius:22px;
    background:
    radial-gradient(circle at 50% 40%,#9a238b,transparent 35%),
    linear-gradient(135deg,#1a0640,#090817);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:95px;
    margin-bottom:18px;
}

.nowTitle{
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.nowArtist{
    text-align:center;
    color:#999;
    margin-top:7px;
}

.progress{
    width:100%;
    margin-top:20px;
    accent-color:#ff3d91;
}

.controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
    margin-top:22px;
}

.control{
    border:none;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.play{
    width:68px;
    height:68px;
    border-radius:50%;
    border:none;
    background:#e72882;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.favCurrent{
    display:block;
    margin:15px auto 0;
    border:none;
    background:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}

/* SECTION TITLE */

.sectionTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.sectionTitle h2{
    font-size:22px;
}

.sectionTitle span{
    color:#ff3d91;
    font-size:14px;
}

/* STATIONS */

.song{
    display:flex;
    align-items:center;
    gap:12px;
    background:#151225;
    border:1px solid #29233c;
    padding:12px;
    border-radius:17px;
    margin-top:10px;
    cursor:pointer;
}

.song:hover{
    border-color:#d82b82;
}

.songPic{
    width:52px;
    height:52px;
    border-radius:14px;
    background:linear-gradient(135deg,#5d1678,#17132c);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    flex-shrink:0;
}

.songInfo{
    flex:1;
    min-width:0;
}

.songInfo h3{
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.songInfo p{
    color:#888;
    font-size:13px;
    margin-top:5px;
}

.songFav{
    font-size:22px;
    padding:5px;
    cursor:pointer;
}

.songFav.active{
    color:#ff3d6e;
}

/* LOADING */

.loading,
.empty{
    text-align:center;
    padding:30px 10px;
    color:#888;
}

/* NAV */

.nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:78px;
    background:#100e18;
    border-top:1px solid #29243a;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.navItem{
    text-align:center;
    color:#85818e;
    font-size:12px;
    cursor:pointer;
    min-width:65px;
}

.navIcon{
    font-size:24px;
    margin-bottom:4px;
}

.navItem.active{
    color:#ff3d91;
}

/* DESKTOP */

@media(min-width:700px){

    .app{
        max-width:900px;
    }

    .categories{
        grid-template-columns:repeat(4,1fr);
    }

}
</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            Madhu Music World <span>♫</span>
        </div>

        <div class="search" onclick="toggleSearch()">
            🔍
        </div>

    </div>


    <!-- SEARCH -->

    <div class="searchBox" id="searchBox">

        <input
        id="searchInput"
        type="search"
        placeholder="Search Bengali, Hindi, Bhajan..."
        oninput="searchStations()">

    </div>


    <!-- HERO -->

    <div class="hero">

        <h2>Feel The Music</h2>

        <p>Live Online Radio • Your Music World</p>

    </div>


    <!-- CATEGORY -->

    <div class="categories">

        <button
        class="category active"
        onclick="category('all',this)">
            🎵 All Stations
        </button>

        <button
        class="category"
        onclick="category('bengali',this)">
            🎶 Bengali
        </button>

        <button
        class="category"
        onclick="category('hindi',this)">
            🎵 Hindi
        </button>

        <button
        class="category"
        onclick="category('rabindra',this)">
            🎼 Rabindra Sangeet
        </button>

        <button
        class="category"
        onclick="category('bhajan',this)">
            🕉️ Bhajan
        </button>

    </div>


    <!-- PLAYER -->

    <div class="player">

        <div class="cover">
            🎧
        </div>

        <div
        class="nowTitle"
        id="title">
            Select Station
        </div>

        <div
        class="nowArtist"
        id="artist">
            Online Music
        </div>

        <input
        class="progress"
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0">

        <div class="controls">

            <button
            class="control"
            onclick="previous()">
                ⏮
            </button>

            <button
            class="play"
            id="play"
            onclick="playPause()">
                ▶
            </button>

            <button
            class="control"
            onclick="next()">
                ⏭
            </button>

        </div>

        <button
        class="favCurrent"
        id="favCurrent"
        onclick="toggleCurrentFavorite()">
            ♡
        </button>

    </div>


    <!-- STATIONS -->

    <div class="sectionTitle">

        <h2 id="sectionTitle">
            Popular Stations
        </h2>

        <span>
            Online
        </span>

    </div>


    <div id="songs">

        <div class="loading">
            Loading music...
        </div>

    </div>

</div>


<!-- BOTTOM NAV -->

<div class="nav">

    <div
    class="navItem active"
    onclick="home(this)">

        <div class="navIcon">⌂</div>
        Home

    </div>


    <div
    class="navItem"
    onclick="music(this)">

        <div class="navIcon">♫</div>
        Music

    </div>


    <div
    class="navItem"
    onclick="favoritesPage(this)">

        <div class="navIcon">♡</div>
        Favorite

    </div>


    <div
    class="navItem"
    onclick="library(this)">

        <div class="navIcon">▱</div>
        Library

    </div>

</div>


<audio id="audio"></audio>


<script>

/* =========================
   MADHU MUSIC WORLD
========================= */

const audio =
document.getElementById("audio");

const songs =
document.getElementById("songs");

const title =
document.getElementById("title");

const artist =
document.getElementById("artist");

const play =
document.getElementById("play");

const progress =
document.getElementById("progress");

const favCurrent =
document.getElementById("favCurrent");

let stations = [];

let currentIndex = -1;

let currentCategory = "all";

let favorites =
JSON.parse(
localStorage.getItem("madhuFavorites") || "[]"
);


/* RADIO SERVERS */

const servers = [

"https://de1.api.radio-browser.info",

"https://fr1.api.radio-browser.info",

"https://nl1.api.radio-browser.info"

];


/* SEARCH */

function toggleSearch(){

    const box =
    document.getElementById("searchBox");

    if(box.style.display === "block"){

        box.style.display = "none";

    }else{

        box.style.display = "block";

        document
        .getElementById("searchInput")
        .focus();

    }

}


/* API */

async function api(url){

    for(let server of servers){

        try{

            const response =
            await fetch(server + url);

            if(response.ok){

                return await response.json();

            }

        }catch(e){

            console.log(e);

        }

    }

    return [];

}


/* LOAD */

async function loadStations(){

    songs.innerHTML =
    '<div class="loading">Loading online stations...</div>';

    let url =
    "/json/stations/search?limit=50&hidebroken=true&order=votes&reverse=true";

    if(currentCategory === "bengali"){

        url += "&tag=bengali";

    }

    if(currentCategory === "hindi"){

        url += "&tag=hindi";

    }

    if(currentCategory === "rabindra"){

        url += "&tag=rabindra";

    }

    if(currentCategory === "bhajan"){

        url += "&tag=bhajan";

    }

    const data =
    await api(url);

    stations =
    data.filter(s =>
    s.url_resolved || s.url
    );

    render();

}


/* RENDER */

function render(){

    songs.innerHTML = "";

    if(!stations.length){

        songs.innerHTML =
        '<div class="empty">No online station found.</div>';

        return;

    }


    stations.forEach((station,index)=>{

        const div =
        document.createElement("div");

        div.className = "song";

        const id =
        station.stationuuid;

        const isFav =
        favorites.includes(id);


        div.innerHTML = `

            <div class="songPic">
                🎧
            </div>

            <div class="songInfo">

                <h3>
                    ${safe(station.name || "Online Radio")}
                </h3>

                <p>
                    ${safe(
                        station.language ||
                        station.country ||
                        "Online"
                    )}
                </p>

            </div>

            <div
            class="songFav ${isFav ? "active" : ""}"
            onclick="
            event.stopPropagation();
            toggleFavorite(${index})
            ">

                ${isFav ? "♥" : "♡"}

            </div>

        `;


        div.onclick = () =>
        playStation(index);

        songs.appendChild(div);

    });

}


/* PLAY */

function playStation(index){

    if(!stations[index]) return;

    currentIndex = index;

    const station =
    stations[index];

    const stream =
    station.url_resolved ||
    station.url;

    audio.src = stream;

    title.textContent =
    station.name || "Online Music";

    artist.textContent =
    station.language ||
    station.country ||
    "Online Radio";

    updateCurrentFavorite();

    audio.play()
    .then(()=>{

        play.innerHTML = "❚❚";

    })
    .catch(()=>{

        alert(
        "এই stationটি এখন play হচ্ছে না। অন্য station চেষ্টা করুন।"
        );

    });

}


/* PLAY PAUSE */

function playPause(){

    if(!audio.src){

        if(stations.length){

            playStation(0);

        }

        return;

    }


    if(audio.paused){

        audio.play();

    }else{

        audio.pause();

    }

}


/* AUDIO EVENTS */

audio.addEventListener("play",()=>{

    play.innerHTML = "❚❚";

});


audio.addEventListener("pause",()=>{

    play.innerHTML = "▶";

});


/* NEXT */

function next(){

    if(!stations.length) return;

    currentIndex++;

    if(currentIndex >= stations.length){

        currentIndex = 0;

    }

    playStation(currentIndex);

}


/* PREVIOUS */

function previous(){

    if(!stations.length) return;

    currentIndex--;

    if(currentIndex < 0){

        currentIndex =
        stations.length - 1;

    }

    playStation(currentIndex);

}


/* PROGRESS */

audio.addEventListener(
"timeupdate",
()=>{

    if(
        audio.duration &&
        isFinite(audio.duration)
    ){

        progress.value =
        (audio.currentTime /
        audio.duration) * 100;

    }

});


progress.addEventListener(
"input",
()=>{

    if(
        audio.duration &&
        isFinite(audio.duration)
    ){

        audio.currentTime =
        audio.duration *
        progress.value / 100;

    }

});


/* CATEGORY */

function category(type,button){

    currentCategory = type;

    document
    .querySelectorAll(".category")
    .forEach(b =>
    b.classList.remove("active")
    );

    button.classList.add("active");


    if(type === "all"){

        document.getElementById(
        "sectionTitle"
        ).textContent =
        "Popular Stations";

    }

    if(type === "bengali"){

        document.getElementById(
        "sectionTitle"
        ).textContent =
        "Bengali Music";

    }

    if(type === "hindi"){

        document.getElementById(
        "sectionTitle"
        ).textContent =
        "Hindi Music";

    }

    if(type === "rabindra"){

        document.getElementById(
        "sectionTitle"
        ).textContent =
        "Rabindra Sangeet";

    }

    if(type === "bhajan"){

        document.getElementById(
        "sectionTitle"
        ).textContent =
        "Bhajan";

    }


    loadStations();

}


/* SEARCH */

async function searchStations(){

    const q =
    document
    .getElementById("searchInput")
    .value
    .trim();


    if(q.length < 2){

        loadStations();

        return;

    }


    songs.innerHTML =
    '<div class="loading">Searching...</div>';


    const data =
    await api(
        "/json/stations/search?name=" +
        encodeURIComponent(q) +
        "&limit=50&hidebroken=true"
    );


    stations =
    data.filter(s =>
    s.url_resolved || s.url
    );


    document.getElementById(
    "sectionTitle"
    ).textContent =
    "Search Results";


    render();

}


/* FAVORITE */

function toggleFavorite(index){

    const station =
    stations[index];

    if(!station) return;

    const id =
    station.stationuuid;


    if(favorites.includes(id)){

        favorites =
        favorites.filter(x => x !== id);

    }else{

        favorites.push(id);

    }


    localStorage.setItem(
        "madhuFavorites",
        JSON.stringify(favorites)
    );


    render();

    updateCurrentFavorite();

}


/* CURRENT FAVORITE */

function toggleCurrentFavorite(){

    if(currentIndex < 0) return;

    toggleFavorite(currentIndex);

}


/* UPDATE FAVORITE */

function updateCurrentFavorite(){

    if(currentIndex < 0){

        favCurrent.innerHTML = "♡";

        return;

    }


    const station =
    stations[currentIndex];

    if(!station) return;


    if(
        favorites.includes(
            station.stationuuid
        )
    ){

        favCurrent.innerHTML = "♥";

        favCurrent.style.color =
        "#ff3d6e";

    }else{

        favCurrent.innerHTML = "♡";

        favCurrent.style.color =
        "white";

    }

}


/* FAVORITES PAGE */

async function favoritesPage(nav){

    activeNav(nav);

    document.getElementById(
    "sectionTitle"
    ).textContent =
    "My Favorites";


    if(!favorites.length){

        stations = [];

        songs.innerHTML =
        '<div class="empty">❤️ আপনার Favorite station এখানে থাকবে।</div>';

        return;

    }


    const data =
    await api(
    "/json/stations/search?limit=100&hidebroken=true"
    );


    stations =
    data.filter(s =>
    favorites.includes(
        s.stationuuid
    )
    );


    render();

}


/* LIBRARY */

function library(nav){

    activeNav(nav);

    document.getElementById(
    "sectionTitle"
    ).textContent =
    "My Library";


    if(!favorites.length){

        stations = [];

        songs.innerHTML =
        '<div class="empty">📂 Library এখন খালি।<br><br>পছন্দের গান/স্টেশন Favorite করুন।</div>';

        return;

    }


    favoritesPage(nav);

}


/* HOME */

function home(nav){

    activeNav(nav);

    currentCategory = "all";

    document
    .querySelectorAll(".category")
    .forEach((b,i)=>
    b.classList.toggle(
        "active",
        i === 0
    ));


    document.getElementById(
    "sectionTitle"
    ).textContent =
    "Popular Stations";


    loadStations();

}


/* MUSIC */

function music(nav){

    activeNav(nav);

    document.getElementById(
    "sectionTitle"
    ).textContent =
    "Music";


    loadStations();

}


/* NAV ACTIVE */

function activeNav(nav){

    document
    .querySelectorAll(".navItem")
    .forEach(n =>
    n.classList.remove("active")
    );

    nav.classList.add("active");

}


/* SAFE HTML */

function safe(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

loadStations();

</script>

</body>
</html>
